  #app { width:100%; max-width:1100px; height:90vh; max-height:900px; background:rgba(255,255,255,.7); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:40px; box-shadow:0 25px 50px -8px rgba(0,20,30,.25); border:1px solid rgba(255,255,255,.5); overflow:hidden; display:flex; flex-direction:column; position:relative; }

  .home-grid { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:16px; width:100%; height:100%; flex:1; }
  .big-btn { background:white; border-radius:32px; padding:20px; box-shadow:0 12px 24px -8px rgba(0,32,64,.12); border:1px solid rgba(255,255,255,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; cursor:pointer; transition:.2s; color:#1e2f4b; background-size:cover; background-position:center; background-repeat:no-repeat; position:relative; overflow:hidden; width:100%; height:100%; }

  .big-btn:hover { transform:translateY(-4px); box-shadow:0 20px 30px -10px #1e3c7250; }
  .big-btn::before { content:''; position:absolute; inset:0; background:rgba(255,255,255,.7); border-radius:32px; z-index:0; display:none; }
  .big-btn.has-bg::before { display:block; }

  .part-grid { display:flex; flex-wrap:wrap; gap:20px; margin-top:16px; }

  .iframe-container { margin-top:28px; background:#ffffffc0; border-radius:36px; padding:20px; box-shadow:inset 0 1px 4px #00000008,0 8px 18px #00000010; backdrop-filter:blur(4px); text-align:center; width:100%; }
  iframe { border-radius:24px; background:white; width:100%; max-width:500px; height:380px; border:none; }

  /* Listen & Read */
  .lr-screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; border-radius:0; }
  .lr-speed-group { position:absolute; top:14px; left:14px; display:flex; gap:10px; z-index:5; }
  .lr-speed-btn { background:#fff; border:2px solid #e2ecf9; border-radius:26px; padding:12px 20px; font-size:1.15rem; font-weight:700; color:#1e3c72; cursor:pointer; display:flex; align-items:center; gap:8px; box-shadow:0 4px 12px rgba(0,0,0,.07); transition:.15s; }
  .lr-speed-btn:hover { background:#eaf2ff; transform:translateY(-2px); }
  .lr-speed-btn:active { transform:scale(.95); }
  .lr-progress { position:absolute; top:20px; left:50%; transform:translateX(-50%); font-size:1.1rem; font-weight:700; color:#5a7391; background:rgba(255,255,255,.75); padding:6px 20px; border-radius:30px; z-index:5; }
  .lr-check { position:absolute; top:14px; right:14px; width:70px; height:70px; border-radius:50%; background:linear-gradient(145deg,#34d399,#16a34a); color:#fff; display:flex; align-items:center; justify-content:center; font-size:2.2rem; box-shadow:0 10px 24px rgba(22,163,74,.45); opacity:0; transform:scale(.4); transition:.28s cubic-bezier(.34,1.56,.64,1); z-index:5; pointer-events:none; }
  .lr-check.show { opacity:1; transform:scale(1); }
  .lr-text-wrap { position:absolute; inset:110px 24px 150px 24px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .lr-text { text-align:center; line-height:1.12; font-weight:800; color:#14243d; white-space:pre-wrap; overflow-wrap:anywhere; word-break:normal; letter-spacing:.01em; }
  .lr-bottom { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:26px; z-index:5; }
  .lr-nav { width:66px; height:66px; border-radius:50%; border:none; background:#fff; color:#1e3c72; font-size:1.7rem; cursor:pointer; box-shadow:0 8px 18px rgba(0,0,0,.13); transition:.15s; display:flex; align-items:center; justify-content:center; }
  .lr-nav:hover:not(:disabled) { background:#eaf2ff; transform:translateY(-2px); }
  .lr-nav:disabled { opacity:.25; cursor:default; }
  .lr-rec { width:112px; height:112px; border-radius:50%; border:none; background:linear-gradient(145deg,#2a5298,#1e3c72); color:#fff; font-size:2.7rem; cursor:pointer; box-shadow:0 14px 28px rgba(30,60,114,.42); transition:.15s; display:flex; align-items:center; justify-content:center; }
  .lr-rec:hover { transform:translateY(-3px); }
  .lr-rec.recording { background:linear-gradient(145deg,#ef4444,#b91c1c); animation:pulse 1.1s infinite; }
  .lr-rec:disabled { opacity:.45; cursor:default; }
  .lr-finish { display:none; align-items:center; gap:10px; border:none; border-radius:60px; padding:0 30px; height:66px; font-size:1.35rem; font-weight:800; color:#fff; cursor:pointer; background:linear-gradient(145deg,#cbd5e1,#94a3b8); box-shadow:0 8px 18px rgba(0,0,0,.12); transition:.2s; }
  .lr-finish.ready { background:linear-gradient(145deg,#34d399,#16a34a); box-shadow:0 12px 26px rgba(22,163,74,.45); }
  .lr-finish.ready:hover { transform:translateY(-3px) scale(1.03); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(239,68,68,.55);} 70%{box-shadow:0 0 0 26px rgba(239,68,68,0);} 100%{box-shadow:0 0 0 0 rgba(239,68,68,0);} }

  /* modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(10,30,50,.45); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:900; padding:20px; }
  .modal-card { background:#fff; border-radius:36px; padding:30px; width:100%; max-width:540px; text-align:center; box-shadow:0 30px 60px rgba(0,20,40,.3); }
  .modal-card h2 { color:#1e3c72; font-size:1.5rem; margin-bottom:8px; }
  .si-step { width:100%; margin-top:10px; }
  .campus-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px; }
  .campus-btn { padding:32px 20px; border:2px solid #dbe4f0; border-radius:24px; background:#fff; cursor:pointer; font-size:1.5rem; font-weight:700; color:#1e3c72; display:flex; flex-direction:column; align-items:center; gap:10px; transition:.15s; font-family:inherit; }
  .campus-btn:hover { border-color:#2a5298; background:#eaf2ff; transform:translateY(-3px); }
  .campus-btn i { font-size:2.2rem; color:#2a5298; }
  .level-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:20px; }
  .level-btn { padding:24px 20px; border:2px solid #dbe4f0; border-radius:20px; background:#fff; cursor:pointer; font-size:1.3rem; font-weight:700; color:#1e3c72; transition:.15s; font-family:inherit; }
  .level-btn:hover { border-color:#2a5298; background:#eaf2ff; transform:translateY(-2px); }
  .si-footer { display:flex; gap:12px; justify-content:center; margin-top:22px; }
  .name-input-row { display:flex; gap:10px; align-items:center; margin-top:20px; }
  .name-input-row input { flex:1; padding:16px 20px; border-radius:60px; border:2px solid #dbe4f0; font-size:1.2rem; text-align:center; outline:none; }
  .name-input-row input:focus { border-color:#2a5298; }
  .btn-primary { background:#1e3c72; color:#fff; border:none; padding:14px 30px; border-radius:60px; font-weight:700; cursor:pointer; font-size:1.05rem; box-shadow:0 8px 16px #1e3c7240; font-family:inherit; }
  .btn-outline { background:transparent; border:2px solid #1e3c72; color:#1e3c72; padding:12px 28px; border-radius:60px; font-weight:700; cursor:pointer; font-size:1.05rem; font-family:inherit; }

  /* My Recordings FAB + 页面 */
  .my-rec-fab { position:absolute; right:24px; bottom:24px; width:64px; height:64px; border-radius:50%; border:none; background:linear-gradient(145deg,#f5b301,#e6a000); color:#fff; font-size:1.6rem; cursor:pointer; box-shadow:0 10px 24px rgba(245,179,1,.45); display:flex; align-items:center; justify-content:center; z-index:20; transition:.2s; }
  .my-rec-fab:hover { transform:translateY(-3px) scale(1.05); }
  .my-rec-fab.hidden { display:none !important; }
  .myrec-header { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .myrec-header h2 { font-size:2rem; }
  .myrec-sub { color:#6b7c93; margin-bottom:16px; font-size:1rem; }
  .myrec-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; margin-top:16px; width:100%; }
  .myrec-part-card { background:#fff; border-radius:24px; padding:24px; text-align:center; cursor:pointer; box-shadow:0 8px 18px rgba(0,0,0,.05); border:1px solid #eef4ff; transition:.15s; }
  .myrec-part-card:hover { transform:translateY(-4px); box-shadow:0 16px 26px -8px #1e3c7240; }
  .myrec-part-card i { font-size:2.2rem; color:#e6a000; margin-bottom:10px; }
  .myrec-part-card h3 { font-size:1.4rem; font-weight:700; color:#1e2f4b; }
  .myrec-part-card .sub { font-size:.95rem; color:#6b7c93; margin-top:6px; }
  .myrec-item-list { display:flex; flex-direction:column; gap:12px; margin-top:16px; width:100%; }
  .myrec-item { background:#fff; border-radius:20px; padding:16px 20px; box-shadow:0 4px 12px rgba(0,0,0,.04); border:1px solid #eef4ff; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .myrec-item-text { flex:1; min-width:200px; font-size:1.3rem; font-weight:700; color:#1e2f4b; }
  .myrec-item-stars { display:flex; gap:2px; }
  .myrec-star { font-size:1.6rem; color:#d1d9e4; }
  .myrec-star.active { color:#f5b301; }
  .myrec-audio-btn { background:#eef4ff; color:#1e3c72; border:none; border-radius:40px; padding:10px 20px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:8px; font-family:inherit; font-size:.95rem; transition:.15s; }
  .myrec-audio-btn:hover { background:#dce9ff; }
  .myrec-no-audio { color:#8fa0b6; font-size:.85rem; }

  #snackbar { visibility:hidden; min-width:200px; background:#1e3c72; color:white; text-align:center; border-radius:40px; padding:14px 24px; position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000; box-shadow:0 10px 20px #00000020; }
  #snackbar.show { visibility:visible; animation:fadein .3s, fadeout .3s 2.5s; }
  @keyframes fadein { from{bottom:0;opacity:0;} to{bottom:30px;opacity:1;} }
  @keyframes fadeout { from{bottom:30px;opacity:1;} to{bottom:0;opacity:0;} }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="nav-header">
    <button class="back-btn" id="backButton"><i class="fas fa-arrow-left"></i></button>
    <h1>📘 AI Time Grade 3</h1>
    <button class="cloud-refresh-btn" id="cloudRefreshBtn" title="Sync cloud config"><i class="fas fa-cloud-download-alt"></i></button>
  </div>
  <div id="viewContainer" class="view-container"></div>
  <button id="myRecFab" class="my-rec-fab" title="My Recordings"><i class="fas fa-star"></i></button>
</div>
<div id="snackbar">⚙️ Done</div>

<script>
"use strict";

const SUPABASE_URL = 'https://dwagktwarlzkusawrtqq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3YWdrdHdhcmx6a3VzYXdydHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MzMwODQsImV4cCI6MjEwNzEwOTA4NH0.5iMbu7R3-LGHjZMFAuRH93sepxJr7bjrWexj3Invlmk';
const LS_KEY = 'english_integrated_config';
const BUCKET = 'site-assets';

const DEFAULT_CONFIG = {
  settingPassword: '0303',
  aiTalkButtons: [
    { id:'aitalk-1', name:'Topic 06 - 1', url:'https://doubao.com/bot/Ew35NrPV', bgUrl:'' },
    { id:'aitalk-2', name:'Topic 06 - 2', url:'https://doubao.com/bot/3Ts8VUxv', bgUrl:'' },
    { id:'aitalk-3', name:'Topic 06 - 3', url:'https://doubao.com/bot/dtyTUTvW', bgUrl:'' },
    { id:'aitalk-4', name:'Topic 06 - 4', url:'https://doubao.com/bot/bqqTQuWx', bgUrl:'' }
  ],
  discussionButtons: [
    { id:'discussion-1', name:'Debate apple', url:'https://doubao.com/bot/ovuVreEm', bgUrl:'' },
    { id:'discussion-2', name:'Debate Banana', url:'https://doubao.com/bot/VnCWIcTq', bgUrl:'' }
  ],
  homeBgUrl:'', gamePageBgUrl:'', rolePlayPageBgUrl:'', listenReadPageBgUrl:'',
  btnGameBgUrl:'', btnRolePlayBgUrl:'', btnListenReadBgUrl:'', btnAITalkBgUrl:'',
  gameParts: [
    { id:'part1', name:'Part 1', games:[
      { id:'game1', name:'Wordwall Game', embedCode:'<iframe style="max-width:100%" src="https://wordwall.net/embed/fc41e69b25a747f0a439d228a56fcf59?themeId=1&templateId=3&fontStackId=0" width="500" height="380" frameborder="0" allowfullscreen></iframe>', bgUrl:'' }
    ]},
    { id:'part2', name:'Part 2', games:[] },
    { id:'part3', name:'Part 3', games:[] }
  ],
  listenReadParts: [
    { id:'lr-1', name:'Unit 1', bgUrl:'', items:[] },
    { id:'lr-2', name:'Unit 2', bgUrl:'', items:[] }
  ]
};

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
async function sbFetch(path, options) {
  options = options || {};
  const headers = Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY
  }, options.headers || {});
  return fetch(SUPABASE_URL + path, Object.assign({}, options, { headers }));
}
function encodePath(p) { return String(p).split('/').map(encodeURIComponent).join('/'); }
async function uploadToStorage(blob, path, contentType) {
  try {
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodePath(path)}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'x-upsert': 'true',
        'Content-Type': contentType || 'application/octet-stream'
      },
      body: blob
    });
    if (!res.ok) return null;
    return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${encodePath(path)}`;
  } catch (e) { console.error(e); return null; }
}

let config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
let currentView = 'home';
let currentPartId = null;
const myRec = { campus:'', level:'', studentName:'', rows:[], parts:[], currentPartId:null };

const viewContainer = document.getElementById('viewContainer');
const backButton = document.getElementById('backButton');
const cloudRefreshBtn = document.getElementById('cloudRefreshBtn');
const snackbar = document.getElementById('snackbar');
const myRecFab = document.getElementById('myRecFab');

function showSnackbar(text, isError) {
  snackbar.textContent = text || '⚙️ Done';
  snackbar.style.background = isError ? '#b53b3b' : '#1e3c72';
  snackbar.classList.add('show');
  setTimeout(() => { snackbar.classList.remove('show'); snackbar.style.background = '#1e3c72'; }, 2800);
}

function normalizeConfig(cfg) {
  if (!cfg || typeof cfg !== 'object') cfg = {};
  ['aiTalkButtons','discussionButtons'].forEach(k => { if (!Array.isArray(cfg[k])) cfg[k] = []; });
  [cfg.aiTalkButtons, cfg.discussionButtons].forEach(arr => arr.forEach(b => { if (typeof b.bgUrl !== 'string') b.bgUrl = ''; }));
  if (!Array.isArray(cfg.gameParts) || !cfg.gameParts.length) cfg.gameParts = JSON.parse(JSON.stringify(DEFAULT_CONFIG.gameParts));
  cfg.gameParts.forEach(p => {
    if (!Array.isArray(p.games)) p.games = [];
    p.games.forEach(g => {
      if (typeof g.bgUrl !== 'string') g.bgUrl = '';
      if (typeof g.embedCode !== 'string') g.embedCode = '';
    });
  });
  if (!Array.isArray(cfg.listenReadParts)) cfg.listenReadParts = [];
  cfg.listenReadParts.forEach(p => {
    if (!Array.isArray(p.items)) p.items = [];
    p.items.forEach(it => {
      if (typeof it.text !== 'string') it.text = '';
      if (!Array.isArray(it.colors)) it.colors = [];
      if (typeof it.audioUrl !== 'string') it.audioUrl = '';
    });
  });
  ['homeBgUrl','gamePageBgUrl','rolePlayPageBgUrl','listenReadPageBgUrl',
   'btnGameBgUrl','btnRolePlayBgUrl','btnListenReadBgUrl','btnAITalkBgUrl'].forEach(f => {
    if (typeof cfg[f] !== 'string') cfg[f] = '';
  });
  if (!cfg.settingPassword) cfg.settingPassword = '0303';
  return cfg;
}

async function loadConfigFromCloud(showSuccess) {
  try {
    const res = await sbFetch('/rest/v1/config?id=eq.1&select=data', { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('http ' + res.status);
    const rows = await res.json();
    if (!rows.length || !rows[0].data) throw new Error('empty');
    config = normalizeConfig(Object.assign({}, DEFAULT_CONFIG, rows[0].data));
    localStorage.setItem(LS_KEY, JSON.stringify(config));
    if (showSuccess) showSnackbar('✅ Cloud config synced');
    return true;
  } catch (err) {
    console.warn('cloud load failed', err);
    if (showSuccess) showSnackbar('⚠️ Cloud failed, using local cache', true);
    return false;
  }
}
function loadConfigFromStorage() {
  const stored = localStorage.getItem(LS_KEY);
  if (stored) {
    try { config = normalizeConfig(Object.assign({}, DEFAULT_CONFIG, JSON.parse(stored))); return; } catch (e) {}
  }
  config = normalizeConfig(JSON.parse(JSON.stringify(DEFAULT_CONFIG)));
}

function applyBackground(url, element) {
  if (url && url.trim() !== '') {
    element.style.background = `linear-gradient(145deg, rgba(246,249,252,.85), rgba(230,240,245,.85)), url("${url}") center/cover no-repeat`;
  } else {
    element.style.background = 'linear-gradient(145deg,#f6f9fc 0%,#e6f0f5 100%)';
  }
}
function clearContainerBackground() { viewContainer.style.background = ''; }
function applyContainerBackground(url) {
  if (url && url.trim() !== '') viewContainer.style.background = `linear-gradient(rgba(255,255,255,.8), rgba(255,255,255,.8)), url("${url}") center/cover no-repeat`;
  else clearContainerBackground();
}
function setBtnBackground(el, url) {
  if (url && url.trim() !== '') {
    el.style.backgroundImage = `url("${url}")`;
    el.classList.add('has-bg');
  } else {
    el.style.backgroundImage = '';
    el.classList.remove('has-bg');
  }
}

function setView(view, partId) {
  currentView = view;
  currentPartId = partId === undefined ? currentPartId : partId;
  if (view !== 'listenReadPractice') {
    if (lr.recorder && lr.recorder.state === 'recording') { try { lr.recorder.stop(); } catch (e) {} }
    stopMic();
    stopPlayback();
  }
  myRecFab.classList.toggle('hidden', view !== 'home');
  renderCurrentView();
}
function goBack() {
  if (currentView === 'partDetail') setView('game');

/* ---------- 选校区 → Level → 名字（无语音） ---------- */
function askIdentity(subtitle, onOk) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <h2 id="siTitle"><i class="fas fa-school"></i> Which campus?</h2>
      <p style="color:#6b7c93;" id="siSub">${escapeHtml(subtitle || '')}</p>
      <div id="siStep1" class="si-step">
        <div class="campus-grid">
          <button class="campus-btn" data-campus="West"><i class="fas fa-map-marker-alt"></i>West</button>
          <button class="campus-btn" data-campus="East"><i class="fas fa-map-marker-alt"></i>East</button>
        </div>
      </div>
      <div id="siStep2" class="si-step hidden">
        <div class="level-grid">
          <button class="level-btn" data-level="Level 1">Level 1</button>
          <button class="level-btn" data-level="Level 2">Level 2</button>
          <button class="level-btn" data-level="Level 3">Level 3</button>
          <button class="level-btn" data-level="Level 4">Level 4</button>
        </div>
      </div>
      <div id="siStep3" class="si-step hidden">
        <div class="name-input-row">
          <input type="text" id="studentNameInput" placeholder="Type your name" autocomplete="off" maxlength="20">
        </div>
        <p style="font-size:12px;color:#8fa0b6;margin-top:8px;">Case does not matter, only letters need to match.</p>
      </div>
      <div class="si-footer">
        <button class="btn-outline" id="siBackBtn" style="display:none;">Back</button>
        <button class="btn-primary" id="siNextBtn">Next</button>
        <button class="btn-outline" id="siCancelBtn">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  let step = 1, campus = '', level = '';
  const titleEl = overlay.querySelector('#siTitle');
  const step1 = overlay.querySelector('#siStep1');
  const step2 = overlay.querySelector('#siStep2');
  const step3 = overlay.querySelector('#siStep3');
  const backBtn = overlay.querySelector('#siBackBtn');
  const nextBtn = overlay.querySelector('#siNextBtn');
  const cancelBtn = overlay.querySelector('#siCancelBtn');
  const nameInput = overlay.querySelector('#studentNameInput');

  function showStep(n) {
    step = n;
    step1.classList.toggle('hidden', n !== 1);
    step2.classList.toggle('hidden', n !== 2);
    step3.classList.toggle('hidden', n !== 3);
    backBtn.style.display = n === 1 ? 'none' : 'inline-block';
    nextBtn.textContent = n === 3 ? 'Enter' : 'Next';
    if (n === 1) titleEl.innerHTML = '<i class="fas fa-school"></i> Which campus?';
    else if (n === 2) titleEl.innerHTML = '<i class="fas fa-layer-group"></i> Choose your Level';
    else { titleEl.innerHTML = '<i class="fas fa-user-circle"></i> Type your name'; setTimeout(() => nameInput.focus(), 60); }
  }

  overlay.querySelectorAll('.campus-btn').forEach(btn => {
    btn.onclick = () => {
      overlay.querySelectorAll('.campus-btn').forEach(b => { b.style.borderColor = ''; b.style.background = ''; });
      btn.style.borderColor = '#2a5298'; btn.style.background = '#eaf2ff';
      campus = btn.dataset.campus;
      setTimeout(() => showStep(2), 120);
    };
  });
  overlay.querySelectorAll('.level-btn').forEach(btn => {
    btn.onclick = () => {
      overlay.querySelectorAll('.level-btn').forEach(b => { b.style.borderColor = ''; b.style.background = ''; });
      btn.style.borderColor = '#2a5298'; btn.style.background = '#eaf2ff';
      level = btn.dataset.level;
      setTimeout(() => showStep(3), 120);
    };
  });

  backBtn.onclick = () => { if (step === 2) showStep(1); else if (step === 3) showStep(2); };
  cancelBtn.onclick = () => overlay.remove();
  nextBtn.onclick = () => {
    if (step === 1) { if (!campus) { showSnackbar('Please choose a campus', true); return; } showStep(2); }
    else if (step === 2) { if (!level) { showSnackbar('Please choose a level', true); return; } showStep(3); }
    else {
      const name = nameInput.value.trim();
      if (!name) { showSnackbar('Please type your name', true); nameInput.focus(); return; }
      overlay.remove();
      onOk({ campus, level, name });
    }
  };
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') nextBtn.click(); });
}

/* ---------- 听读练习 ---------- */
function renderListenReadPractice() {
  const part = (config.listenReadParts || []).find(p => p.id === lr.partId);
  if (!part || !part.items || !part.items.length) { setView('listenReadParts'); return; }
  lr.items = part.items;
  if (lr.index >= lr.items.length) lr.index = lr.items.length - 1;
  if (lr.index < 0) lr.index = 0;

  viewContainer.innerHTML = `
    <div class="lr-screen">
      <div class="lr-speed-group">
        <button class="lr-speed-btn" id="lrSlowBtn"><i class="fas fa-turtle"></i> Slow</button>
        <button class="lr-speed-btn" id="lrNormalBtn"><i class="fas fa-rabbit"></i> Normal</button>
      </div>
      <div class="lr-progress" id="lrProgress">1 / 1</div>
      <div class="lr-check" id="lrCheck"><i class="fas fa-check"></i></div>
      <div class="lr-text-wrap" id="lrTextWrap"><div class="lr-text" id="lrText"></div></div>
      <div class="lr-bottom">
        <button class="lr-nav" id="lrPrev"><i class="fas fa-arrow-left"></i></button>
        <button class="lr-rec" id="lrRec"><i class="fas fa-microphone"></i></button>
        <button class="lr-nav" id="lrNext"><i class="fas fa-arrow-right"></i></button>
        <button class="lr-finish" id="lrFinish"><i class="fas fa-flag-checkered"></i> Finish</button>
      </div>
    </div>`;

  lrEls = {
    text: document.getElementById('lrText'),
    wrap: document.getElementById('lrTextWrap'),
    check: document.getElementById('lrCheck'),
    progress: document.getElementById('lrProgress'),
    prev: document.getElementById('lrPrev'),
    next: document.getElementById('lrNext'),
    rec: document.getElementById('lrRec'),
    finish: document.getElementById('lrFinish')
  };

  document.getElementById('lrSlowBtn').onclick = () => playCurrent(true);
  document.getElementById('lrNormalBtn').onclick = () => playCurrent(false);
  lrEls.prev.onclick = () => { if (lr.index > 0) { lr.index--; updateLrItem(); } };
  lrEls.next.onclick = () => { if (lr.index < lr.items.length - 1) { lr.index++; updateLrItem(); } };
  lrEls.rec.onclick = toggleRecording;

  // 结束按钮：始终可点；没全部完成时弹确认
  lrEls.finish.onclick = () => {
    const total = lr.items.length;
    const doneCount = lr.items.filter(it => lr.done[it.id]).length;
    if (doneCount < total) {
      if (!confirm(`还有 ${total - doneCount} 句没有完成录音，确定要结束吗？`)) return;
    }
    stopMic();
    stopPlayback();
    lr.done = {};
    lr.index = 0;
    showSnackbar('🎉 Finished!');
    setView('listenReadParts');
  };

  updateLrItem();
}

function renderItemHtml(item) {
  const text = item.text || '';
  const colors = Array.isArray(item.colors) ? item.colors : [];
  const chars = Array.from(text);
  if (!chars.length) return '<span style="color:#94a3b8;">(empty)</span>';
  return chars.map((ch, i) => {
    if (ch === '\n') return '<br>';
    const c = colors[i];
    const safe = ch === ' ' ? ' ' : escapeHtml(ch);
    return c ? `<span style="color:${c}">${safe}</span>` : `<span>${safe}</span>`;
  }).join('');
}

function updateLrItem() {
  const item = lr.items[lr.index];
  if (!item) return;
  const els = lrEls;
  els.text.innerHTML = renderItemHtml(item);
  els.progress.textContent = (lr.index + 1) + ' / ' + lr.items.length;

  const isLast = lr.index === lr.items.length - 1;
  els.next.style.display = isLast ? 'none' : 'flex';
  els.finish.style.display = isLast ? 'flex' : 'none';
  els.prev.disabled = (lr.index === 0);

  els.check.classList.toggle('show', !!lr.done[item.id]);

  const allDone = lr.items.every(it => lr.done[it.id]);
  els.finish.disabled = false;
  els.finish.classList.toggle('ready', allDone);

  requestAnimationFrame(() => fitText(els.text, els.wrap));
}

function fitText(textEl, wrapEl) {
  if (!textEl || !wrapEl) return;
  const cs = getComputedStyle(wrapEl);
  const availW = wrapEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = wrapEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (availW <= 20 || availH <= 20) return;
  textEl.style.width = availW + 'px';
  let lo = 18, hi = 420;
  textEl.style.fontSize = hi + 'px';
  for (let i = 0; i < 12; i++) {
    const mid = (lo + hi) / 2;
    textEl.style.fontSize = mid + 'px';
    if (textEl.scrollHeight <= availH) lo = mid; else hi = mid;
  }
  textEl.style.fontSize = Math.max(18, Math.floor(lo)) + 'px';
}

function stopPlayback() {
  if (lrAudio) { try { lrAudio.pause(); } catch (e) {} lrAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

function playCurrent(slow) {
  const item = lr.items[lr.index];
  if (!item) return;
  stopPlayback();
  const rate = slow ? 0.6 : 1.0;
  if (item.audioUrl) {
    lrAudio = new Audio(item.audioUrl);
    lrAudio.playbackRate = rate;
    try { lrAudio.preservesPitch = true; } catch (e) {}
    lrAudio.play().catch(() => showSnackbar('Audio play failed', true));
    return;
  }
  if (!('speechSynthesis' in window)) { showSnackbar('No audio uploaded', true); return; }
  const u = new SpeechSynthesisUtterance(item.text || '');
  u.lang = 'en-US';
  u.rate = slow ? 0.5 : 1.0;
  speechSynthesis.speak(u);
}

async function ensureMic() {
  if (lrStream && lrStream.active) return lrStream;
  lrStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  return lrStream;
}
function stopMic() {
  if (lrStream) { lrStream.getTracks().forEach(t => t.stop()); lrStream = null; }
}
function setRecordingUI(on) {
  if (!lrEls.rec) return;
  lrEls.rec.classList.toggle('recording', on);
  lrEls.rec.innerHTML = on ? '<i class="fas fa-stop"></i>' : '<i class="fas fa-microphone"></i>';
  lrEls.prev.disabled = on || lr.index === 0;
  lrEls.next.disabled = on;
}

async function toggleRecording() {
  if (lr.recorder && lr.recorder.state === 'recording') { lr.recorder.stop(); return; }
  try {
    const stream = await ensureMic();
    const candidates = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    const mime = (window.MediaRecorder && candidates.find(t => MediaRecorder.isTypeSupported(t))) || '';
    lr.chunks = [];
    let rec;
    try {
      const opts = { audioBitsPerSecond: 32000 };
      if (mime) opts.mimeType = mime;
      rec = new MediaRecorder(stream, opts);
    } catch (e) {
      rec = new MediaRecorder(stream);
    }
    lr.recorder = rec;
    rec.ondataavailable = e => { if (e.data && e.data.size) lr.chunks.push(e.data); };
    rec.onstop = async () => {
      const blob = new Blob(lr.chunks, { type: rec.mimeType || 'audio/webm' });
      lr.chunks = [];
      setRecordingUI(false);
      await handleRecordingDone(blob);
    };
    rec.start();
    setRecordingUI(true);
  } catch (err) {
    console.error(err);
    showSnackbar('Microphone unavailable, please allow permission', true);
  }
}

async function handleRecordingDone(blob) {
  const item = lr.items[lr.index];
  if (!item) return;
  if (!blob || blob.size < 800) { showSnackbar('Recording too short, try again', true); return; }
  showSnackbar('⏳ Uploading…');
  const part = (config.listenReadParts || []).find(p => p.id === lr.partId);
  const ext = blob.type.indexOf('mp4') >= 0 ? 'mp4' : blob.type.indexOf('ogg') >= 0 ? 'ogg' : 'webm';
  const safeCampus = (lr.campus || 'Unknown').replace(/[^\w-]/g, '_');
  const safeLevel = (lr.level || 'Unknown').replace(/[^\w-]/g, '_');
  const safeName = (lr.studentName || 'student').replace(/[^\w\u4e00-\u9fa5-]/g, '_').slice(0, 40);
  const path = `listenread/${safeCampus}/${safeLevel}/${lr.partId}/${item.id}/${safeName}_${Date.now()}.${ext}`;

  const url = await uploadToStorage(blob, path, blob.type);
  if (!url) { showSnackbar('❌ Upload failed, please retry', true); return; }

  try {
    const res = await sbFetch('/rest/v1/recordings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({
        campus: lr.campus || '',
        level: lr.level || '',
        part_id: lr.partId,
        part_name: part ? part.name : '',
        item_id: item.id,
        item_text: item.text || '',
        student_name: lr.studentName || '',
        file_path: path,
        public_url: url,
        star: 0
      })
    });
    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      throw new Error('HTTP ' + res.status + ' ' + errText.slice(0, 120));
    }
  } catch (e) {
    console.warn('record insert failed', e);
    showSnackbar('⚠️ Audio uploaded but record not saved, please tell teacher', true);
  }

  lr.done[item.id] = true;
  showSnackbar('✅ Uploaded');
  updateLrItem();
}

   My Recordings
   ============================================================ */
async function fetchStudentRecordings(campus, level, name) {
  const safeName = String(name).replace(/[%_]/g, '\\$&');
  const url = `/rest/v1/recordings?select=*&campus=eq.${encodeURIComponent(campus)}&level=eq.${encodeURIComponent(level)}&student_name=ilike.${encodeURIComponent(safeName)}&order=created_at.desc`;
  const res = await sbFetch(url, { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error('query failed');
  return await res.json();
}

function groupRecordingsByPart(rows) {
  const map = new Map();
  rows.forEach(r => {
    if (!map.has(r.part_id)) map.set(r.part_id, []);
    map.get(r.part_id).push(r);
  });
  return [...map.entries()].map(([partId, list]) => {
    const cfg = (config.listenReadParts || []).find(p => p.id === partId);
    return { partId, name: cfg ? cfg.name : (list[0].part_name || partId), rows: list };
  });
}

function groupRecordingsByItem(rows) {
  const map = new Map();
  rows.forEach(r => {
    if (!map.has(r.item_id)) map.set(r.item_id, []);
    map.get(r.item_id).push(r);
  });
  return [...map.entries()].map(([itemId, list]) => {
    const latest = list[0];
    let cfgItem = null;
    (config.listenReadParts || []).forEach(p => {
      (p.items || []).forEach(it => { if (it.id === itemId) cfgItem = it; });
    });
    return {
      itemId,
      text: latest.item_text || (cfgItem ? cfgItem.text : ''),
      audioUrl: cfgItem ? cfgItem.audioUrl : '',
      star: Number(latest.star) || 0,
      latest
    };
  });
}

async function verifyAndLoadRecordings(info) {
  showSnackbar('⏳ Looking for your recordings…');
  try {
    const rows = await fetchStudentRecordings(info.campus, info.level, info.name);
    if (!rows.length) {
      showSnackbar('No recordings found for this name, please check your spelling', true);
      return false;
    }
    myRec.campus = info.campus;
    myRec.level = info.level;
    myRec.studentName = rows[0].student_name;
    myRec.rows = rows;
    myRec.parts = groupRecordingsByPart(rows);
    myRec.currentPartId = null;
    return true;
  } catch (e) {
    console.error(e);
    showSnackbar('Query failed, please retry', true);
    return false;
  }
}

      ${myRec.parts.length === 0 ? '<p class="empty-message">No recordings yet</p>' : `
        <div class="myrec-grid">
          ${myRec.parts.map(p => `
            <div class="myrec-part-card" data-part-id="${escapeHtml(p.partId)}">
              <i class="fas fa-book-open"></i>
              <h3>${escapeHtml(p.name)}</h3>
              <div class="sub">${p.rows.length} recordings</div>
            </div>
          `).join('')}
        </div>
      `}
    </div>`;
  viewContainer.querySelectorAll('.myrec-part-card').forEach(card => {
    card.addEventListener('click', () => {
      myRec.currentPartId = card.dataset.partId;
      setView('myRecordingDetail');
    });
  });
}

function renderMyRecordingDetail() {
  clearContainerBackground();
  const part = myRec.parts.find(p => p.partId === myRec.currentPartId);
  if (!part) { setView('myRecordings'); return; }
  const items = groupRecordingsByItem(part.rows);
  viewContainer.innerHTML = `
    <div style="width:100%;">
      <div class="myrec-header"><h2>${escapeHtml(part.name)}</h2></div>
      ${items.length === 0 ? '<p class="empty-message">No recordings in this unit</p>' : `
        <div class="myrec-item-list">
          ${items.map(item => `
            <div class="myrec-item">
              <div class="myrec-item-text">${escapeHtml(item.text)}</div>
              <div class="myrec-item-stars">
                ${[1,2,3].map(n => `<span class="myrec-star ${n <= item.star ? 'active' : ''}">★</span>`).join('')}
              </div>
              ${item.audioUrl ? `
                <button class="myrec-audio-btn" data-url="${escapeHtml(item.audioUrl)}">
                  <i class="fas fa-play"></i> Correct audio
                </button>
              ` : `<span class="myrec-no-audio">No reference audio</span>`}
            </div>
          `).join('')}
        </div>
      `}
    </div>`;
  viewContainer.querySelectorAll('.myrec-audio-btn').forEach(btn => {
    btn.addEventListener('click', () => playCorrectAudio(btn.dataset.url));
  });
}

let correctAudio = null;
function playCorrectAudio(url) {
  if (correctAudio) { try { correctAudio.pause(); } catch (e) {} }
  correctAudio = new Audio(url);
  correctAudio.play().catch(() => showSnackbar('Audio play failed', true));
}

/* ============================================================
   Startup
   ============================================================ */
backButton.onclick = goBack;
cloudRefreshBtn.onclick = () => loadConfigFromCloud(true);

myRecFab.onclick = () => {
  askIdentity('My Recordings', async info => {
    const ok = await verifyAndLoadRecordings(info);
    if (ok) setView('myRecordings');
  });
};

loadConfigFromStorage();
renderCurrentView();
loadConfigFromCloud(false).then(ok => { if (ok) renderCurrentView(); });
</script>
</body>
</html>
