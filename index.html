function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
async function sbFetch(path, options) {
  options = options || {};
  const headers = Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY
  }, options.headers || {});
  return fetch(SUPABASE_URL + path, Object.assign({}, options, { headers }));
}
function encodePath(p) { return String(p).split('/').map(encodeURIComponent).join('/'); }
async function uploadToStorage(blob, path, contentType) {
  try {
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodePath(path)}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'x-upsert': 'true',
        'Content-Type': contentType || 'application/octet-stream'
      },
      body: blob
    });
    if (!res.ok) return null;
    return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${encodePath(path)}`;
  } catch (e) { console.error(e); return null; }
}

function normalizeConfig(cfg) {
  if (!cfg || typeof cfg !== 'object') cfg = {};
  ['aiTalkButtons','discussionButtons'].forEach(k => { if (!Array.isArray(cfg[k])) cfg[k] = []; });
  [cfg.aiTalkButtons, cfg.discussionButtons].forEach(arr => arr.forEach(b => { if (typeof b.bgUrl !== 'string') b.bgUrl = ''; }));
  if (!Array.isArray(cfg.gameParts) || !cfg.gameParts.length) cfg.gameParts = JSON.parse(JSON.stringify(DEFAULT_CONFIG.gameParts));
  cfg.gameParts.forEach(p => {
    if (!Array.isArray(p.games)) p.games = [];
    p.games.forEach(g => {
      if (typeof g.bgUrl !== 'string') g.bgUrl = '';
      if (typeof g.embedCode !== 'string') g.embedCode = '';
    });
  });
  if (!Array.isArray(cfg.listenReadParts)) cfg.listenReadParts = [];
  cfg.listenReadParts.forEach(p => {
    if (!Array.isArray(p.items)) p.items = [];
    p.items.forEach(it => {
      if (typeof it.text !== 'string') it.text = '';
      if (!Array.isArray(it.colors)) it.colors = [];
      if (typeof it.audioUrl !== 'string') it.audioUrl = '';
    });
  });
  if (!Array.isArray(cfg.roleplayUnits)) cfg.roleplayUnits = [];
  cfg.roleplayUnits.forEach(function (u) {
    if (!Array.isArray(u.turns)) u.turns = [];
    if (typeof u.name !== 'string') u.name = '';
    if (typeof u.id !== 'string') u.id = '';
  });
  if (!cfg.roleplaySettings || typeof cfg.roleplaySettings !== 'object') {
    cfg.roleplaySettings = { matchThreshold: 0.62, maxStars: 3, maxRetryPerTurn: 5 };
  }
  ['homeBgUrl','gamePageBgUrl','rolePlayPageBgUrl','listenReadPageBgUrl',
   'btnGameBgUrl','btnRolePlayBgUrl','btnListenReadBgUrl','btnAITalkBgUrl'].forEach(f => {
    if (typeof cfg[f] !== 'string') cfg[f] = '';
  });
  if (!cfg.settingPassword) cfg.settingPassword = '0303';
  return cfg;
}

async function loadConfigFromCloud(showSuccess) {

  }
}

function renderItemHtml(item) {
  const text = item.text || '';
  const colors = Array.isArray(item.colors) ? item.colors : [];
  const chars = Array.from(text);
  if (!chars.length) return '<span style="color:#94a3b8;">(empty)</span>';
  return chars.map((ch, i) => {
    if (ch === '\n') return '<br>';
    const c = colors[i];
    const safe = ch === ' ' ? ' ' : escapeHtml(ch);
    return c ? `<span style="color:${c}">${safe}</span>` : `<span>${safe}</span>`;
  }).join('');
}

function updateLrItem() {
  const item = lr.items[lr.index];
  if (!item) return;
  const els = lrEls;
  els.text.innerHTML = renderItemHtml(item);
  els.progress.textContent = (lr.index + 1) + ' / ' + lr.items.length;

  const isLast = lr.index === lr.items.length - 1;
  els.next.style.display = isLast ? 'none' : 'flex';
  els.finish.style.display = isLast ? 'flex' : 'none';
  els.prev.disabled = (lr.index === 0);

  els.check.classList.toggle('show', !!lr.done[item.id]);

  const allDone = lr.items.every(it => lr.done[it.id]);
  els.finish.disabled = false;
  els.finish.classList.toggle('ready', allDone);

  requestAnimationFrame(() => fitText(els.text, els.wrap));
}

function fitText(textEl, wrapEl) {
  if (!textEl || !wrapEl) return;
  const cs = getComputedStyle(wrapEl);
  const availW = wrapEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = wrapEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (availW <= 20 || availH <= 20) return;
  textEl.style.width = availW + 'px';
  let lo = 18, hi = 420;
  textEl.style.fontSize = hi + 'px';
  for (let i = 0; i < 12; i++) {
    const mid = (lo + hi) / 2;
    textEl.style.fontSize = mid + 'px';
    if (textEl.scrollHeight <= availH) lo = mid; else hi = mid;
  }
  textEl.style.fontSize = Math.max(18, Math.floor(lo)) + 'px';
}

function stopPlayback() {
  if (lrAudio) { try { lrAudio.pause(); } catch (e) {} lrAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

function playCurrent(slow) {
  const item = lr.items[lr.index];
  if (!item) return;
  stopPlayback();
  const rate = slow ? 0.6 : 1.0;
  if (item.audioUrl) {
    lrAudio = new Audio(item.audioUrl);
    lrAudio.playbackRate = rate;
    try { lrAudio.preservesPitch = true; } catch (e) {}
    lrAudio.play().catch(() => showSnackbar('Audio play failed', true));
    return;
  }
  if (!('speechSynthesis' in window)) { showSnackbar('No audio uploaded', true); return; }
  const u = new SpeechSynthesisUtterance(item.text || '');
  u.lang = 'en-US';
  u.rate = slow ? 0.5 : 1.0;
  speechSynthesis.speak(u);
}

async function ensureMic() {
  if (lrStream && lrStream.active) return lrStream;
  lrStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  return lrStream;
}
function stopMic() {
  if (lrStream) { lrStream.getTracks().forEach(t => t.stop()); lrStream = null; }
}
function setRecordingUI(on) {
  if (!lrEls.rec) return;
  lrEls.rec.classList.toggle('recording', on);
  lrEls.rec.innerHTML = on ? '<i class="fas fa-stop"></i>' : '<i class="fas fa-microphone"></i>';
  lrEls.prev.disabled = on || lr.index === 0;
  lrEls.next.disabled = on;
}

async function toggleRecording() {
  if (lr.recorder && lr.recorder.state === 'recording') { lr.recorder.stop(); return; }
  try {
    const stream = await ensureMic();
    const candidates = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    const mime = (window.MediaRecorder && candidates.find(t => MediaRecorder.isTypeSupported(t))) || '';
    lr.chunks = [];
    let rec;
    try {
      const opts = { audioBitsPerSecond: 32000 };
      if (mime) opts.mimeType = mime;
      rec = new MediaRecorder(stream, opts);
    } catch (e) {
      rec = new MediaRecorder(stream);
    }
    lr.recorder = rec;
    rec.ondataavailable = e => { if (e.data && e.data.size) lr.chunks.push(e.data); };
    rec.onstop = async () => {
      const blob = new Blob(lr.chunks, { type: rec.mimeType || 'audio/webm' });
      lr.chunks = [];
      setRecordingUI(false);
      await handleRecordingDone(blob);
    };
    rec.start();
    setRecordingUI(true);
  } catch (err) {
    console.error(err);
    showSnackbar('Microphone unavailable, please allow permission', true);
  }
}

async function handleRecordingDone(blob) {
  const item = lr.items[lr.index];
  if (!item) return;
  if (!blob || blob.size < 800) { showSnackbar('Recording too short, try again', true); return; }
  showSnackbar('⏳ Uploading…');
  const part = (config.listenReadParts || []).find(p => p.id === lr.partId);
  const ext = blob.type.indexOf('mp4') >= 0 ? 'mp4' : blob.type.indexOf('ogg') >= 0 ? 'ogg' : 'webm';
  const safeCampus = (lr.campus || 'Unknown').replace(/[^\w-]/g, '_');
  const safeLevel = (lr.level || 'Unknown').replace(/[^\w-]/g, '_');
  const safeName = (lr.studentName || 'student').replace(/[^\w\u4e00-\u9fa5-]/g, '_').slice(0, 40);
  const path = `listenread/${safeCampus}/${safeLevel}/${lr.partId}/${item.id}/${safeName}_${Date.now()}.${ext}`;

  const url = await uploadToStorage(blob, path, blob.type);
  if (!url) { showSnackbar('❌ Upload failed, please retry', true); return; }

  try {
    const res = await sbFetch('/rest/v1/recordings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({
        campus: lr.campus || '',
        level: lr.level || '',
        part_id: lr.partId,
        part_name: part ? part.name : '',
        item_id: item.id,
        item_text: item.text || '',
        student_name: lr.studentName || '',
        file_path: path,
        public_url: url,
        star: 0
      })
    });
    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      throw new Error('HTTP ' + res.status + ' ' + errText.slice(0, 120));
    }
  } catch (e) {
    console.warn('record insert failed', e);
    showSnackbar('⚠️ Audio uploaded but record not saved, please tell teacher', true);
  }

  lr.done[item.id] = true;
  showSnackbar('✅ Uploaded');
  updateLrItem();
}

});

async function fetchStudentRecordings(campus, level, name) {
  const safeName = String(name).replace(/[%_]/g, '\\$&');
  const url = `/rest/v1/recordings?select=*&campus=eq.${encodeURIComponent(campus)}&level=eq.${encodeURIComponent(level)}&student_name=ilike.${encodeURIComponent(safeName)}&order=created_at.desc`;
  const res = await sbFetch(url, { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error('query failed');
  return await res.json();
}

function groupRecordingsByPart(rows) {
  const map = new Map();
  rows.forEach(r => {
    if (!map.has(r.part_id)) map.set(r.part_id, []);
    map.get(r.part_id).push(r);
  });
  return [...map.entries()].map(([partId, list]) => {
    const cfg = (config.listenReadParts || []).find(p => p.id === partId);
    return { partId, name: cfg ? cfg.name : (list[0].part_name || partId), rows: list };
  });
}

function groupRecordingsByItem(rows) {
  const map = new Map();
  rows.forEach(r => {
    if (!map.has(r.item_id)) map.set(r.item_id, []);
    map.get(r.item_id).push(r);
  });
  return [...map.entries()].map(([itemId, list]) => {
    const latest = list[0];
    let cfgItem = null;
    (config.listenReadParts || []).forEach(p => {
      (p.items || []).forEach(it => { if (it.id === itemId) cfgItem = it; });
    });
    return {
      itemId,
      text: latest.item_text || (cfgItem ? cfgItem.text : ''),
      audioUrl: cfgItem ? cfgItem.audioUrl : '',
      star: Number(latest.star) || 0,
      latest
    };
  });
}

async function verifyAndLoadRecordings(info) {
  showSnackbar('⏳ Looking for your recordings…');
  try {
    const rows = await fetchStudentRecordings(info.campus, info.level, info.name);
    if (!rows.length) {
      showSnackbar('No recordings found for this name, please check your spelling', true);
      return false;
    }
    myRec.campus = info.campus;
    myRec.level = info.level;
    myRec.studentName = rows[0].student_name;
    myRec.rows = rows;
    myRec.parts = groupRecordingsByPart(rows);
    myRec.currentPartId = null;
    return true;
  } catch (e) {
    console.error(e);
    showSnackbar('Query failed, please retry', true);
    return false;
  }
}

const rp = {

  turnIndex: 0,
  attemptId: null,
  turnResults: {},
  retryCount: 0,
  usedHint: false,

function rpUpdateUi() {
  const convo = document.getElementById('rpConvo');
  const bottom = document.getElementById('rpBottom');
  const badge = document.getElementById('rpRoleBadge');
  const progress = document.getElementById('rpProgress');
  const switchBtn = document.getElementById('rpSwitchBtn');
  if (!convo || !bottom) return;

  badge.textContent = '你是角色 ' + rp.studentRole;
  switchBtn.innerHTML = rp.studentRole === 'B'
    ? '<i class="fas fa-exchange-alt"></i> 切换到 A'
    : '<i class="fas fa-exchange-alt"></i> 切换到 B';

  const turns = rp.unit.turns;
  const studentTurns = turns.filter(function (t) { return t.role === rp.studentRole; }).length;
  const doneTurns = Object.values(rp.turnResults).filter(function (r) { return r.matched; }).length;
  progress.textContent = doneTurns + ' / ' + studentTurns;

  let convoHtml = '';
  turns.forEach(function (t, i) {
    if (i > rp.turnIndex) return;
    const isStudent = t.role === rp.studentRole;
    const isCurrent = i === rp.turnIndex;
    const res = rp.turnResults[i];
    let statusHtml = '';
    if (isStudent && res && res.matched) {
      statusHtml = '<div class="rp-turn-status ok">✓ 通过'
        + (res.retryCount ? '（重试 ' + res.retryCount + ' 次）' : '')
        + '</div>';
    }
    const speaking = (isCurrent && !isStudent && rp.isAiSpeaking) ? ' rp-turn-speaking' : '';
    const current = isCurrent ? ' rp-turn-current' : '';
    convoHtml += '<div class="rp-turn ' + (isStudent ? 'rp-turn-student' : 'rp-turn-ai') + current + speaking + '">'
      + '<div class="rp-turn-avatar">' + t.role + '</div>'
      + '<div class="rp-turn-bubble">'
      + '<div class="rp-turn-role">' + (isStudent ? '你' : 'AI') + ' · 角色 ' + t.role + '</div>'
      + '<div class="rp-turn-text">' + escapeHtml(t.text) + '</div>'
      + statusHtml
      + '</div></div>';
  });
  convo.innerHTML = convoHtml;
  convo.scrollTop = convo.scrollHeight;

  if (rp.finished) { bottom.innerHTML = ''; return; }
  const currentTurn = turns[rp.turnIndex];
  if (!currentTurn) { bottom.innerHTML = ''; return; }

  if (currentTurn.role === rp.studentRole) {
    const hintBtn = rp.usedHint
      ? ''
      : '<button class="rp-btn-round" id="rpHintBtn" title="提示"><i class="fas fa-lightbulb"></i></button>';
    const hintHtml = rp.usedHint
      ? '<div class="rp-hint-box">💡 提示：<b>' + escapeHtml(currentTurn.text) + '</b></div>'
      : '';
    const replayBtn = '<button class="rp-btn-round" id="rpReplayBtn" title="重听上一句 AI 台词"><i class="fas fa-volume-up"></i></button>';
    const statusMsg = rp.isProcessing
      ? '<div class="rp-loading">🔍 正在识别你的回答…</div>'
      : '';
    const errorMsg = rp.retryCount > 0
      ? '<div class="rp-error-msg">你的回答不对哦，请重新回答</div>'
      : '';
    bottom.innerHTML = errorMsg + hintHtml + statusMsg
      + '<div class="rp-actions">'
      + replayBtn
      + '<button class="rp-rec ' + (rp.isRecording ? 'recording' : '') + '" id="rpRecBtn" '
      + (rp.isProcessing ? 'disabled' : '') + '>'
      + '<i class="fas ' + (rp.isRecording ? 'fa-stop' : 'fa-microphone') + '"></i>'
      + '</button>'
      + hintBtn
      + '</div>';
    const recBtn = document.getElementById('rpRecBtn');
    if (recBtn) recBtn.onclick = rpToggleRecording;
    const hb = document.getElementById('rpHintBtn');
    if (hb) hb.onclick = function () { rp.usedHint = true; rpUpdateUi(); };
    const rb = document.getElementById('rpReplayBtn');
    if (rb) rb.onclick = function () { rpReplayLastAi(); };
  } else {
    bottom.innerHTML = rp.isAiSpeaking
      ? '<div class="rp-loading">🔊 AI 正在说话…</div>'
      : '';
  }
}

async function rpAdvance() {
  if (rp.finished) return;
  const turns = rp.unit.turns;
  if (rp.turnIndex >= turns.length) { await rpFinish(); return; }
  const turn = turns[rp.turnIndex];

  if (turn.role === rp.studentRole) { rpUpdateUi(); return; }

  rpUpdateUi();
  try {
    rp.isAiSpeaking = true;
    rpUpdateUi();
    await rpPlayTts(turn.text);
  } catch (e) {
    console.warn('TTS failed', e);
    showSnackbar('AI 语音播放失败，将直接跳到下一轮', true);
    await rpSleep(800);
  } finally {
    rp.isAiSpeaking = false;
  }
  rp.turnIndex++;
  rpUpdateUi();
  rpAdvance();
}

function rpSleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

async function rpPlayTts(text) {
  const res = await fetch(RP_FN_TTS, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'apikey': SUPABASE_KEY
    },
    body: JSON.stringify({ text: text })
  });
  if (!res.ok) throw new Error('TTS HTTP ' + res.status);
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  return new Promise(function (resolve) {
    rp.audio = new Audio(url);
    rp.audio.onended = function () { URL.revokeObjectURL(url); rp.audio = null; resolve(); };
    rp.audio.onerror = function () { URL.revokeObjectURL(url); rp.audio = null; resolve(); };
    rp.audio.play().catch(function () { resolve(); });
  });
}

function rpReplayLastAi() {
  for (let i = rp.turnIndex - 1; i >= 0; i--) {
    if (rp.unit.turns[i].role !== rp.studentRole) {
      if (rp.audio) { try { rp.audio.pause(); } catch (e) {} rp.audio = null; }
      rpPlayTts(rp.unit.turns[i].text).catch(function () { showSnackbar('重听失败', true); });
      return;
    }
  }
  showSnackbar('没有上一句 AI 台词', true);
}

async function rpToggleRecording() {
  if (rp.isRecording) { try { rp.recorder.stop(); } catch (e) {} return; }
  if (rp.isProcessing) return;
  if (rp.audio) { try { rp.audio.pause(); } catch (e) {} rp.audio = null; }
  try {
    rp.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    const mime = (window.MediaRecorder && candidates.find(function (t) { return MediaRecorder.isTypeSupported(t); })) || '';
    rp.chunks = [];
    const opts = { audioBitsPerSecond: 32000 };
    if (mime) opts.mimeType = mime;
    rp.recorder = new MediaRecorder(rp.stream, opts);
    rp.recorder.ondataavailable = function (e) { if (e.data && e.data.size) rp.chunks.push(e.data); };
    rp.recorder.onstop = async function () {
      const blob = new Blob(rp.chunks, { type: rp.recorder.mimeType || 'audio/webm' });
      rp.chunks = [];
      if (rp.stream) { rp.stream.getTracks().forEach(function (t) { t.stop(); }); rp.stream = null; }
      rp.isRecording = false;
      rpUpdateUi();
      await rpProcessRecording(blob);
    };
    rp.recorder.start();
    rp.isRecording = true;
    rpUpdateUi();
  } catch (err) {
    console.error(err);
    showSnackbar('麦克风不可用，请允许权限', true);
  }
}

async function rpProcessRecording(webmBlob) {
  if (!webmBlob || webmBlob.size < 800) {
    showSnackbar('录音太短，请再说一次', true);
    return;
  }
  rp.isProcessing = true;
  rpUpdateUi();

  let transcript = '';
  let matched = false;
  let sim = 0;
  try {
    const wavBlob = await rpWebmToWav16k(webmBlob);
    transcript = await rpFetchAsr(wavBlob);
    const turn = rp.unit.turns[rp.turnIndex];
    const threshold = (config.roleplaySettings && config.roleplaySettings.matchThreshold) || 0.62;
    sim = rpSimilarity(transcript, turn.text);
    matched = sim >= threshold;
  } catch (e) {
    console.error('ASR failed', e);
    rp.isProcessing = false;
    rpUpdateUi();
    showSnackbar('识别失败，请重试', true);
    return;
  }

  rpUploadRecording(webmBlob, rp.turnIndex).catch(function (e) { console.warn(e); });

  if (matched) {
    rp.turnResults[rp.turnIndex] = {
      matched: true, retryCount: rp.retryCount, usedHint: rp.usedHint,
      transcript: transcript, similarity: sim
    };
    rpSaveAnswer(rp.turnIndex, transcript, sim, true).catch(function (e) { console.warn(e); });
    rp.retryCount = 0;
    rp.usedHint = false;
    rp.turnIndex++;
    rp.isProcessing = false;
    rpUpdateUi();
    setTimeout(function () { rpAdvance(); }, 500);
  } else {
    rp.retryCount++;
    rpSaveAnswer(rp.turnIndex, transcript, sim, false).catch(function (e) { console.warn(e); });
    rp.isProcessing = false;
    rpUpdateUi();
    showSnackbar('你的回答不对哦，请重新回答', true);
  }
}

async function rpWebmToWav16k(webmBlob) {
  const arrayBuffer = await webmBlob.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const audioBuffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
  try { ctx.close(); } catch (e) {}
  const float32 = audioBuffer.getChannelData(0);
  const int16 = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  const wavBuffer = new ArrayBuffer(44 + int16.length * 2);
  const view = new DataView(wavBuffer);
  const ws = function (o, s) { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF');
  view.setUint32(4, 36 + int16.length * 2, true);
  ws(8, 'WAVE');
  ws(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, 16000, true);
  view.setUint32(28, 32000, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  ws(36, 'data');
  view.setUint32(40, int16.length * 2, true);
  new Int16Array(wavBuffer, 44).set(int16);
  return new Blob([wavBuffer], { type: 'audio/wav' });
}

function rpBlobToBase64(blob) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onloadend = function () {
      const s = String(reader.result || '');
      resolve(s.slice(s.indexOf(',') + 1));
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function rpFetchAsr(wavBlob) {
  const base64 = await rpBlobToBase64(wavBlob);
  const res = await fetch(RP_FN_ASR, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'apikey': SUPABASE_KEY
    },
    body: JSON.stringify({ audio: base64, format: 'wav' })
  });
  if (!res.ok) throw new Error('ASR HTTP ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(typeof data.error === 'string' ? data.error : JSON.stringify(data.error));
  return data.text || '';
}

function rpNormalizeText(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
}

function rpSimilarity(a, b) {
  a = rpNormalizeText(a);
  b = rpNormalizeText(b);
  if (!a && !b) return 1;
  if (!a || !b) return 0;
  if (a === b) return 1;
  const m = a.length, n = b.length;
  const dp = [];
  for (let i = 0; i <= m; i++) {
    dp.push([]);
    for (let j = 0; j <= n; j++) dp[i].push(0);
  }
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return 1 - dp[m][n] / Math.max(m, n);
}

async function rpUploadRecording(webmBlob, turnIndex) {
  if (!rp.attemptId) return;
  const ext = (webmBlob.type.indexOf('mp4') >= 0) ? 'mp4' : (webmBlob.type.indexOf('ogg') >= 0) ? 'ogg' : 'webm';
  const safeCampus = (rp.campus || 'Unknown').replace(/[^\w-]/g, '_');
  const safeLevel = (rp.level || 'Unknown').replace(/[^\w-]/g, '_');
  const path = 'roleplay/' + safeCampus + '/' + safeLevel + '/' + rp.unit.id + '/' + rp.attemptId + '/' + turnIndex + '_' + Date.now() + '.' + ext;
  const url = await uploadToStorage(webmBlob, path, webmBlob.type);
  return url;
}

async function rpSaveAnswer(turnIndex, transcript, similarity, matched) {
  if (!rp.attemptId) return;
  const turn = rp.unit.turns[turnIndex];
  try {
    await sbFetch('/rest/v1/roleplay_answers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({
        attempt_id: rp.attemptId,
        turn_index: turnIndex,
        expected_text: turn ? turn.text : '',
        transcript: transcript,
        similarity: Math.round(similarity * 1000) / 1000,
        matched: matched,
        retry_count: rp.retryCount,
        used_hint: rp.usedHint
      })
    });
  } catch (e) { console.warn('save answer failed', e); }
}

async function rpCreateAttempt() {
  const res = await sbFetch('/rest/v1/roleplay_attempts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: JSON.stringify({
      campus: rp.campus, level: rp.level, student_name: rp.studentName,
      unit_id: rp.unit.id, unit_name: rp.unit.name,
      student_role: rp.studentRole,
      total_turns: rp.unit.turns.length,
      completed: false
    })
  });
  if (!res.ok) throw new Error('attempt HTTP ' + res.status);
  const rows = await res.json();
  return rows[0].id;
}

async function rpFinish() {
  if (rp.finished) return;
  rp.finished = true;
  rpCleanup();

  const totalStudentTurns = rp.unit.turns.filter(function (t) { return t.role === rp.studentRole; }).length;
  const results = Object.values(rp.turnResults);
  const correct = results.filter(function (r) { return r.matched; }).length;
  const retryTotal = results.reduce(function (s, r) { return s + (r.retryCount || 0); }, 0);
  const maxStars = (config.roleplaySettings && config.roleplaySettings.maxStars) || 3;

  let stars = 0;
  if (correct === totalStudentTurns && totalStudentTurns > 0) stars = maxStars;
  else if (correct >= Math.ceil(totalStudentTurns * 0.7)) stars = Math.max(1, maxStars - 1);
  else if (correct > 0) stars = 1;
  if (retryTotal > totalStudentTurns * 2) stars = Math.max(0, stars - 1);

  if (rp.attemptId) {
    try {
      await sbFetch('/rest/v1/roleplay_attempts?id=eq.' + rp.attemptId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({
          completed: true, stars: stars,
          correct_turns: correct,
          retry_total: retryTotal,
          duration_sec: Math.round((Date.now() - rp.startTime) / 1000)
        })
      });
    } catch (e) { console.warn(e); }
  }

  rpShowResult(stars, correct, totalStudentTurns, retryTotal, maxStars);
}

function rpShowResult(stars, correct, total, retryTotal, maxStars) {
  const screen = document.querySelector('.rp-screen');
  if (!screen) return;
  let starsHtml = '';
  for (let i = 0; i < maxStars; i++) {
    starsHtml += '<span class="' + (i < stars ? 'active' : '') + '">★</span>';
  }
  const overlay = document.createElement('div');
  overlay.className = 'rp-result-overlay';
  overlay.innerHTML = '<div class="rp-result-card">'
    + '<h2>🎉 完成啦！</h2>'
    + '<div class="sub">' + escapeHtml(rp.unit.name || '') + ' · 角色 ' + rp.studentRole + '</div>'
    + '<div class="rp-stars-row">' + starsHtml + '</div>'
    + '<div class="rp-result-stats">'
    + '<div class="rp-result-stat"><span class="num">' + correct + '/' + total + '</span><span class="lbl">正确回合</span></div>'
    + '<div class="rp-result-stat"><span class="num">' + retryTotal + '</span><span class="lbl">重试次数</span></div>'
    + '<div class="rp-result-stat"><span class="num">' + stars + '</span><span class="lbl">获得星星</span></div>'
    + '</div>'
    + '<div class="rp-result-actions">'
    + '<button class="btn-primary" id="rpAgainBtn"><i class="fas fa-redo"></i> 再来一次</button>'
    + '<button class="btn-outline" id="rpSwitchRoleBtn"><i class="fas fa-exchange-alt"></i> 换个角色</button>'
    + '<button class="btn-outline" id="rpBackBtn"><i class="fas fa-arrow-left"></i> 返回</button>'
    + '</div>'
    + '</div>';
  screen.appendChild(overlay);
  overlay.querySelector('#rpAgainBtn').onclick = function () { overlay.remove(); renderRolePlayPractice(); };
  overlay.querySelector('#rpSwitchRoleBtn').onclick = function () {
    overlay.remove();
    rp.studentRole = rp.studentRole === 'A' ? 'B' : 'A';
    renderRolePlayPractice();
  };
  overlay.querySelector('#rpBackBtn').onclick = function () { overlay.remove(); setView('roleplayParts'); };
}
