  .search-empty { text-align:center; color:#8fa0b6; padding:30px 20px; font-size:13px; }

  @keyframes hlPulse {
    0%, 100% { box-shadow:0 2px 10px rgba(0,20,40,.05); }
    25%, 75% { box-shadow:0 0 0 3px #2a5298, 0 10px 30px rgba(42,82,152,.3); }
  }
  .search-highlight { animation:hlPulse 1.8s ease; }
</style>

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function encodePath(p) { return String(p).split('/').map(encodeURIComponent).join('/'); }
function genId(prefix) { return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7); }
function cssEscape(s) { if (window.CSS && CSS.escape) return CSS.escape(s); return String(s).replace(/[^a-zA-Z0-9_-]/g, ch => '\\' + ch); }
function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, 2600);
}
function pickFile(accept) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = accept || '*/*';
    input.onchange = () => resolve(input.files && input.files[0] ? input.files[0] : null);
    input.click();
  });
}
function formatTime(t) {
  if (!t) return '';
  try { return new Date(t).toLocaleString('zh-CN', { hour12: false }); }
  catch (e) { return t; }
}

async function sbFetch(path, options) {
  options = options || {};
  const headers = Object.assign({ 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }, options.headers || {});
  return fetch(SUPABASE_URL + path, Object.assign({}, options, { headers }));
}
async function uploadFile(file, path, contentType) {
  try {
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodePath(path)}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'x-upsert': 'true',
        'Content-Type': contentType || file.type || 'application/octet-stream'
      },
      body: file
    });
    if (!res.ok) { console.error('upload failed', res.status, await res.text().catch(() => '')); return null; }
    return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${encodePath(path)}`;
  } catch (e) { console.error('upload error', e); return null; }
}
async function deleteStorageFile(path) {
  if (!path) return false;
  try {
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodePath(path)}`, {
      method: 'DELETE',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    return res.ok;
  } catch (e) { return false; }
}
async function batchDeleteStorage(paths) {
  if (!paths || !paths.length) return;
  for (let i = 0; i < paths.length; i += 100) {
    const batch = paths.slice(i, i + 100);
    try {
      await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}`, {
        method: 'DELETE',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ prefixes: batch })
      });
    } catch (e) { console.warn('批量删除 storage 失败', e); }
  }
}
function storagePathFromUrl(url) {
  if (!url) return null;
  const marker = `/storage/v1/object/public/${BUCKET}/`;
  const i = url.indexOf(marker);
  if (i < 0) return null;
  return decodeURIComponent(url.slice(i + marker.length).split('?')[0]);
}

function normalizeConfig(cfg) {
  if (!cfg || typeof cfg !== 'object') cfg = {};
  ['aiTalkButtons','discussionButtons'].forEach(k => { if (!Array.isArray(cfg[k])) cfg[k] = []; });
  [cfg.aiTalkButtons, cfg.discussionButtons].forEach(arr => arr.forEach(b => { if (typeof b.bgUrl !== 'string') b.bgUrl = ''; }));
  if (!Array.isArray(cfg.gameParts) || !cfg.gameParts.length) cfg.gameParts = JSON.parse(JSON.stringify(DEFAULT_CONFIG.gameParts));
  cfg.gameParts.forEach(p => {
    if (!Array.isArray(p.games)) p.games = [];
    p.games.forEach(g => {
      if (typeof g.bgUrl !== 'string') g.bgUrl = '';
      if (typeof g.embedCode !== 'string') g.embedCode = '';
    });
  });
  if (!Array.isArray(cfg.listenReadParts)) cfg.listenReadParts = [];
  cfg.listenReadParts.forEach(p => {
    if (!Array.isArray(p.items)) p.items = [];
    p.items.forEach(it => {
      if (typeof it.text !== 'string') it.text = '';
      if (!Array.isArray(it.colors)) it.colors = [];
      if (typeof it.audioUrl !== 'string') it.audioUrl = '';
      alignColors(it);
    });
  });
  ['homeBgUrl','gamePageBgUrl','rolePlayPageBgUrl','listenReadPageBgUrl',
   'btnGameBgUrl','btnRolePlayBgUrl','btnListenReadBgUrl','btnAITalkBgUrl'].forEach(f => {
    if (typeof cfg[f] !== 'string') cfg[f] = '';
  });
  if (!cfg.settingPassword) cfg.settingPassword = '0303';
  return cfg;
}
function alignColors(item) {
  const len = Array.from(item.text || '').length;
  const old = Array.isArray(item.colors) ? item.colors : [];
  const next = [];
  for (let i = 0; i < len; i++) next.push(old[i] || '');
  item.colors = next;
}

async function loadConfigFromCloud(showToast) {
  try {
    const res = await sbFetch('/rest/v1/config?id=eq.1&select=data', { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('http ' + res.status);
    const rows = await res.json();
    if (!rows.length || !rows[0].data) throw new Error('empty');
    config = normalizeConfig(Object.assign({}, DEFAULT_CONFIG, rows[0].data));
    configSource = 'cloud';
    localStorage.setItem(LS_KEY, JSON.stringify(config));
    if (showToast) toast('✅ 已拉取云端配置');
    return true;
  } catch (e) {
    console.warn('云端加载失败', e);
    if (showToast) toast('⚠️ 云端加载失败', true);
    return false;
  }
}
function loadConfigFromStorage() {
  const stored = localStorage.getItem(LS_KEY);
  if (stored) {
    try { config = normalizeConfig(Object.assign({}, DEFAULT_CONFIG, JSON.parse(stored))); configSource = 'local'; return; } catch (e) {}
  }
  config = normalizeConfig(JSON.parse(JSON.stringify(DEFAULT_CONFIG)));
  configSource = 'default';
}
async function publishToCloud() {
  if (!confirm('确定要把当前配置发布到云端吗？所有学生端会立即使用新配置。')) return;
  config.listenReadParts.forEach(p => p.items.forEach(alignColors));
  const btn = document.getElementById('publishBtn');
  btn.disabled = true;
  toast('⏳ 正在发布…');
  try {
    const res = await sbFetch('/rest/v1/config?id=eq.1', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify({ data: config })
    });
    if (!res.ok) throw new Error(await res.text());
    configSource = 'cloud';
    localStorage.setItem(LS_KEY, JSON.stringify(config));
    updateStatusBadge();
    toast('🎉 发布成功');
  } catch (e) {
    console.error(e);
    toast('❌ 发布失败：' + (e.message || '未知错误'), true);
  } finally {
    btn.disabled = false;
  }
}
function updateStatusBadge() {
  const el = document.getElementById('statusBadge');
  if (!el) return;
  const map = { cloud:{ text:'☁️ 云端配置', cls:'' }, local:{ text:'💾 本地缓存', cls:'local' }, default:{ text:'📄 默认配置', cls:'local' } };
  const m = map[configSource] || map.local;
  el.textContent = m.text;
  el.className = 'badge ' + m.cls;
}

function renderCharsHtml(item) {
  const chars = Array.from(item.text || '');
  if (!chars.length) return '<span style="color:#b6c2d2; font-weight:400; font-size:14px;">（在上方输入文本后，这里会显示可上色的字母）</span>';
  const colors = item.colors || [];
  return chars.map((ch, i) => {
    const c = colors[i] || '';
    if (ch === '\n') return '<br>';
    if (ch === ' ') return `<span class="lr-char space" data-action="paint-char" data-item-id="${esc(item.id)}" data-idx="${i}" style="color:${c || '#1e2f4b'}"> </span>`;
    return `<span class="lr-char" data-action="paint-char" data-item-id="${esc(item.id)}" data-idx="${i}" style="color:${c || '#1e2f4b'}">${esc(ch)}</span>`;
  }).join('');
}

/* input 事件 */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'customColor') {
    pickedColor = el.value;
    document.querySelectorAll('.floating-palette .swatch').forEach(s => s.classList.remove('active'));
    return;
  }
  const scope = el.dataset.scope;
  if (!scope) return;
  const key = el.dataset.key;
  if (!key) return;
  const val = el.value;

  if (scope === 'config') config[key] = val;
  else if (scope === 'aiTalk') { const b = config.aiTalkButtons.find(x => x.id === el.dataset.id); if (b) b[key] = val; }
  else if (scope === 'discussion') { const b = config.discussionButtons.find(x => x.id === el.dataset.id); if (b) b[key] = val; }
  else if (scope === 'gamePart') { const p = config.gameParts.find(x => x.id === el.dataset.partId); if (p) p[key] = val; }
  else if (scope === 'game') {
    const p = config.gameParts.find(x => x.id === el.dataset.partId);
    const g = p && p.games.find(x => x.id === el.dataset.gameId);
    if (g) g[key] = val;
  } else if (scope === 'lrPart') { const p = config.listenReadParts.find(x => x.id === el.dataset.partId); if (p) p[key] = val; }
  else if (scope === 'lrItem') {
    const p = config.listenReadParts.find(x => x.id === el.dataset.partId);
    const it = p && p.items.find(x => x.id === el.dataset.itemId);
    if (!it) return;
    if (key === 'text') {
      it.text = val;
      alignColors(it);
      const box = document.querySelector(`.lr-chars[data-item-id="${cssEscape(it.id)}"]`);
      if (box) box.innerHTML = renderCharsHtml(it);
    } else it[key] = val;
  }
});

/* click 事件 */
document.addEventListener('click', async e => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;

  if (action === 'toggle-section') {
    const id = target.dataset.sectionId;
    const body = target.parentElement.querySelector('.section-body');
    if (expanded.has(id)) { expanded.delete(id); body.classList.add('hidden'); target.classList.add('collapsed'); }
    else { expanded.add(id); body.classList.remove('hidden'); target.classList.remove('collapsed'); }
    return;
  }
  if (action === 'pick-color') {
    pickedColor = target.dataset.color || '';
    document.querySelectorAll('.floating-palette .swatch').forEach(s => s.classList.remove('active'));
    target.classList.add('active');
    return;
  }
  if (action === 'paint-char') {
    const itemId = target.dataset.itemId;
    const idx = parseInt(target.dataset.idx, 10);
    const partId = target.closest('.lr-chars').dataset.partId;
    const part = config.listenReadParts.find(p => p.id === partId);
    const it = part && part.items.find(x => x.id === itemId);
    if (!it) return;
    alignColors(it);
    it.colors[idx] = pickedColor;
    target.style.color = pickedColor || '#1e2f4b';
    return;
  }

  if (action === 'img-upload') {
    const field = target.closest('.img-field');
    if (!field) return;
    const file = await pickFile('image/*');
    if (!file) return;
    const base = field.dataset.fixed;
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    toast('⏳ 上传中…');
    const url = await uploadFile(file, `${base}.${ext}`, file.type);
    if (!url) { toast('❌ 上传失败', true); return; }
    applyImgFieldValue(field, url + '?t=' + Date.now());
    toast('✅ 图片已上传');
    return;
  }
  if (action === 'img-clear') {
    const field = target.closest('.img-field');
    if (!field) return;
    const oldVal = field.querySelector('.img-url').value;
    if (!oldVal) return;
    if (!confirm('确定清除这张图片吗？')) return;
    const path = storagePathFromUrl(oldVal);
    applyImgFieldValue(field, '');
    if (path) await deleteStorageFile(path);
    toast('🗑 已清除');
    return;
  }

  if (action === 'upload-lrAudio') {
    const partId = target.dataset.partId;
    const itemId = target.dataset.itemId;
    const part = config.listenReadParts.find(p => p.id === partId);
    const it = part && part.items.find(x => x.id === itemId);
    if (!it) return;
    const file = await pickFile('audio/*');
    if (!file) return;
    const ext = (file.name.split('.').pop() || 'mp3').toLowerCase();
    toast('⏳ 上传音频中…');
    const url = await uploadFile(file, `lr_audio/${itemId}.${ext}`, file.type);
    if (!url) { toast('❌ 上传失败', true); return; }
    it.audioUrl = url + '?t=' + Date.now();
    const itemEl = document.querySelector(`.editor-item[data-lr-item="${cssEscape(itemId)}"]`);
    if (itemEl) {
      const audioRow = itemEl.querySelector('.audio-row');
      audioRow.innerHTML = `
        <button class="btn btn-outline btn-mini" data-action="upload-lrAudio" data-part-id="${esc(partId)}" data-item-id="${esc(itemId)}"><i class="fas fa-upload"></i> 重新上传</button>
        <audio controls src="${esc(it.audioUrl)}"></audio>
        <button class="btn btn-danger btn-mini" data-action="clear-lrAudio" data-part-id="${esc(partId)}" data-item-id="${esc(itemId)}"><i class="fas fa-times"></i> 移除</button>`;
    }
    toast('✅ 音频已上传');
    return;
  }
  if (action === 'clear-lrAudio') {
    const partId = target.dataset.partId;
    const itemId = target.dataset.itemId;
    const part = config.listenReadParts.find(p => p.id === partId);
    const it = part && part.items.find(x => x.id === itemId);
    if (!it) return;
    if (!confirm('确定移除这条音频吗？')) return;
    it.audioUrl = '';
    renderSettings();
    toast('🗑 已移除音频');
    return;
  }

  if (action === 'add-aiTalk') { config.aiTalkButtons.push({ id: genId('aitalk'), name:'New Role-Play', url:'https://', bgUrl:'' }); renderSettings(); toast('已添加'); return; }
  if (action === 'del-aiTalk') { if (!confirm('删除这个 Role-Play 按钮？')) return; config.aiTalkButtons = config.aiTalkButtons.filter(b => b.id !== target.dataset.id); renderSettings(); toast('已删除'); return; }
  if (action === 'add-discussion') { config.discussionButtons.push({ id: genId('discussion'), name:'New AI Talk', url:'https://', bgUrl:'' }); renderSettings(); toast('已添加'); return; }
  if (action === 'del-discussion') { if (!confirm('删除这个 AI Talk 按钮？')) return; config.discussionButtons = config.discussionButtons.filter(b => b.id !== target.dataset.id); renderSettings(); toast('已删除'); return; }
  if (action === 'add-gamePart') { config.gameParts.push({ id: genId('part'), name:'New Part', games:[] }); renderSettings(); toast('已添加 Part'); return; }
  if (action === 'del-gamePart') {
    if (config.gameParts.length <= 1) { toast('至少保留一个 Part', true); return; }
    if (!confirm('删除这个 Part 及其所有游戏？')) return;
    config.gameParts = config.gameParts.filter(p => p.id !== target.dataset.partId);
    renderSettings(); toast('已删除'); return;
  }
  if (action === 'add-game') { const p = config.gameParts.find(x => x.id === target.dataset.partId); if (!p) return; p.games.push({ id: genId('game'), name:'New Game', embedCode:'<iframe width="500" height="380" src="https://"></iframe>', bgUrl:'' }); renderSettings(); toast('已添加游戏'); return; }
  if (action === 'del-game') {
    if (!confirm('删除这个游戏？')) return;
    const p = config.gameParts.find(x => x.id === target.dataset.partId);
    if (!p) return;
    p.games = p.games.filter(g => g.id !== target.dataset.gameId);
    renderSettings(); toast('已删除'); return;
  }
  if (action === 'add-lrPart') { config.listenReadParts.push({ id: genId('lr'), name:'New Unit', bgUrl:'', items:[] }); renderSettings(); toast('已新建单元'); return; }
  if (action === 'del-lrPart') { if (!confirm('删除这个单元及其所有内容？')) return; config.listenReadParts = config.listenReadParts.filter(p => p.id !== target.dataset.partId); renderSettings(); toast('已删除单元'); return; }
  if (action === 'add-lrItem') {
    const p = config.listenReadParts.find(x => x.id === target.dataset.partId);
    if (!p) return;
    p.items.push({ id: genId('lri'), text:'', colors:[], audioUrl:'' });
    renderSettings(); toast('已添加条目');
    setTimeout(() => { const items = document.querySelectorAll('.editor-item[data-lr-item]'); if (items.length) items[items.length - 1].scrollIntoView({ behavior:'smooth', block:'center' }); }, 60);
    return;
  }
  if (action === 'del-lrItem') {
    if (!confirm('删除这条内容？')) return;
    const p = config.listenReadParts.find(x => x.id === target.dataset.partId);
    if (!p) return;
    p.items = p.items.filter(it => it.id !== target.dataset.itemId);
    renderSettings(); toast('已删除'); return;
  }

  if (action === 'publish') { publishToCloud(); return; }
  if (action === 'export-json') {
    const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'english_config.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return;
  }
  if (action === 'import-json') {
    const file = await pickFile('.json,application/json');
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        config = normalizeConfig(Object.assign({}, DEFAULT_CONFIG, imported));
        renderSettings();
        toast('✅ 已导入（记得发布到云端）');
      } catch (err) { toast('❌ JSON 格式错误', true); }
    };
    reader.readAsText(file);
    return;
  }
  if (action === 'reset-default') {
    if (!confirm('恢复默认配置会覆盖当前所有设置，确定吗？')) return;
    config = normalizeConfig(JSON.parse(JSON.stringify(DEFAULT_CONFIG)));
    renderSettings(); toast('已恢复默认配置'); return;
  }

  /* ====== 录音相关 ====== */
  if (action === 'toggle-key') {
    const key = target.dataset.key;
    if (expandedKeys.has(key)) expandedKeys.delete(key);
    else expandedKeys.add(key);
    const wrapper = target.closest('.campus-group, .level-group, .student-group');
    if (!wrapper) return;
    wrapper.classList.toggle('open');
    const body = wrapper.querySelector('.campus-body') || wrapper.querySelector('.level-body') || wrapper.querySelector('.student-body');
    if (body) body.classList.toggle('hidden');
    return;
  }

  if (action === 'export-student') {
    exportStudent(target.dataset.campus, target.dataset.level, target.dataset.student);
    return;
  }

  if (action === 'delete-student') {
    const campus = target.dataset.campus;
    const level = target.dataset.level;
    const student = target.dataset.student;
    const rows = recRows.filter(r =>
      (r.campus || '未分类') === campus &&
      (r.level || '未分类') === level &&
      (r.student_name || '未命名') === student
    );
    deleteRecords(rows, `${campus} / ${level} / ${student}`);
    return;
  }

  if (action === 'delete-level') {
    const campus = target.dataset.campus;
    const level = target.dataset.level;
    const rows = recRows.filter(r =>
      (r.campus || '未分类') === campus &&
      (r.level || '未分类') === level
    );
    deleteRecords(rows, `${campus} / ${level}（全部学生）`);
    return;
  }

  if (action === 'delete-recording') {
    if (!confirm('删除这条录音？')) return;
    const id = target.dataset.id;
    const path = target.dataset.path;
    target.disabled = true;
    try {
      await sbFetch(`/rest/v1/recordings?id=eq.${encodeURIComponent(id)}`, { method: 'DELETE' });
      if (path) await deleteStorageFile(path);
      recRows = recRows.filter(r => String(r.id) !== String(id));
      paintRecList();
      toast('🗑 已删除');
    } catch (e) { toast('删除失败', true); target.disabled = false; }
    return;
  }
});

function applyImgFieldValue(field, value) {
  const scope = field.dataset.imgScope;
  const urlInput = field.querySelector('.img-url');
  if (scope === 'config') config[field.dataset.key] = value;
  else if (scope === 'aiTalk') { const b = config.aiTalkButtons.find(x => x.id === field.dataset.id); if (b) b.bgUrl = value; }
  else if (scope === 'discussion') { const b = config.discussionButtons.find(x => x.id === field.dataset.id); if (b) b.bgUrl = value; }
  else if (scope === 'game') { const p = config.gameParts.find(x => x.id === field.dataset.partId); const g = p && p.games.find(x => x.id === field.dataset.gameId); if (g) g.bgUrl = value; }
  else if (scope === 'lrPart') { const p = config.listenReadParts.find(x => x.id === field.dataset.partId); if (p) p.bgUrl = value; }
  if (urlInput) urlInput.value = value;
  let thumb = field.querySelector('.img-thumb');
  if (value) {
    if (!thumb) { thumb = document.createElement('div'); thumb.className = 'img-thumb'; field.appendChild(thumb); }
    thumb.style.backgroundImage = `url('${value}')`;
  } else if (thumb) thumb.remove();
}

/* ====== 录音渲染 ====== */
async function renderRecordings() {
  const panel = document.getElementById('recordingsPanel');
  if (!recRows.length) {
    panel.innerHTML = '<p class="empty">加载中…</p>';
    await loadRecordings(false);
  }
  paintRecToolbarAndList();
}

function paintRecToolbarAndList() {
  const panel = document.getElementById('recordingsPanel');
  const campuses = [...new Set(recRows.map(r => r.campus || '未分类'))].sort();
  const levels = [...new Set(recRows.map(r => r.level || '未分类'))].sort();
  panel.innerHTML = `
    <div class="toolbar">
      <select id="recCampusFilter">
        <option value="">全部校区</option>
        ${campuses.map(c => `<option value="${esc(c)}" ${recFilter.campus === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
      </select>
      <select id="recLevelFilter">
        <option value="">全部 Level</option>
        ${levels.map(l => `<option value="${esc(l)}" ${recFilter.level === l ? 'selected' : ''}>${esc(l)}</option>`).join('')}
      </select>
      <input type="text" id="recNameFilter" placeholder="按学生名字筛选" value="${esc(recFilter.name)}" style="min-width:160px;">
      <select id="recPartFilter">
        <option value="">全部单元</option>
        ${config.listenReadParts.map(p => `<option value="${esc(p.id)}" ${recFilter.part === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
      </select>
      <button class="btn btn-outline btn-mini" id="recRefreshBtn"><i class="fas fa-sync"></i> 刷新</button>
      <span class="hint" style="margin:0;" id="recCount"></span>
    </div>
    <div id="recList"></div>`;
  document.getElementById('recCampusFilter').onchange = e => { recFilter.campus = e.target.value; paintRecList(); };
  document.getElementById('recLevelFilter').onchange = e => { recFilter.level = e.target.value; paintRecList(); };
  document.getElementById('recNameFilter').oninput = e => { recFilter.name = e.target.value.trim(); paintRecList(); };
  document.getElementById('recPartFilter').onchange = e => { recFilter.part = e.target.value; paintRecList(); };
  document.getElementById('recRefreshBtn').onclick = () => loadRecordings(true);
  paintRecList();
}

async function loadRecordings(showToast) {
  const listEl = document.getElementById('recList');
  if (listEl) listEl.innerHTML = '<p class="empty">加载中…</p>';
  try {
    const res = await sbFetch('/rest/v1/recordings?select=*&order=created_at.desc&limit=2000', { headers: { 'Accept': 'application/json' } });
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      throw new Error('HTTP ' + res.status + ' ' + t.slice(0, 120));
    }
    recRows = await res.json();
    paintRecToolbarAndList();
    if (showToast) toast('✅ 已刷新');
  } catch (e) {
    console.error(e);
    if (listEl) listEl.innerHTML = `
      <div class="help-box" style="background:#fff0f0;border-color:#f3c7c2;color:#a03528;">
        <b>读取录音失败</b><br>请确认 Supabase 中已创建 <code>recordings</code> 表并允许 anon 读取。<br>
        <span style="font-size:12px;opacity:.8;">错误信息：${esc(e.message)}</span>
      </div>`;
    if (showToast) toast('读取失败', true);
  }
}

function paintRecList() {
  const listEl = document.getElementById('recList');
  const countEl = document.getElementById('recCount');
  if (!listEl) return;

  let rows = recRows.slice();
  if (recFilter.name) {
    const kw = recFilter.name.toLowerCase();
    rows = rows.filter(r => (r.student_name || '未命名').toLowerCase().includes(kw));
  }
  if (recFilter.part) rows = rows.filter(r => r.part_id === recFilter.part);
  if (recFilter.campus) rows = rows.filter(r => (r.campus || '未分类') === recFilter.campus);
  if (recFilter.level) rows = rows.filter(r => (r.level || '未分类') === recFilter.level);

  const names = new Set(rows.map(r => r.student_name || '未命名'));
  if (countEl) countEl.textContent = `共 ${rows.length} 条 · ${names.size} 位学生`;

  if (!rows.length) { listEl.innerHTML = '<p class="empty">暂无录音</p>'; return; }

  const tree = new Map();
  rows.forEach(r => {
    const campus = r.campus || '未分类';
    const level = r.level || '未分类';
    const name = r.student_name || '未命名';
    if (!tree.has(campus)) tree.set(campus, new Map());
    const lv = tree.get(campus);
    if (!lv.has(level)) lv.set(level, new Map());
    const stu = lv.get(level);
    if (!stu.has(name)) stu.set(name, []);
    stu.get(name).push(r);
  });

  const html = [];
  [...tree.keys()].sort().forEach(campus => {
    const campusKey = 'c:' + campus;
    const campusOpen = expandedKeys.has(campusKey);
    const levelMap = tree.get(campus);
    let campusTotal = 0;
    levelMap.forEach(m => { m.forEach(arr => { campusTotal += arr.length; }); });

    let levelsHtml = '';
    [...levelMap.keys()].sort().forEach(level => {
      const levelKey = 'l:' + campus + '::' + level;
      const levelOpen = expandedKeys.has(levelKey);
      const studentMap = levelMap.get(level);
      let levelTotal = 0;
      studentMap.forEach(arr => { levelTotal += arr.length; });

      let studentsHtml = '';
      [...studentMap.keys()].sort().forEach(name => {
        const studentKey = 's:' + campus + '::' + level + '::' + name;
        const studentOpen = expandedKeys.has(studentKey);
        const list = studentMap.get(name);
        studentsHtml += `
          <div class="student-group ${studentOpen ? 'open' : ''}" data-student-key="${esc(studentKey)}">
            <div class="student-head-row">
              <button class="student-head" data-action="toggle-key" data-key="${esc(studentKey)}">
                <span class="avatar">${esc((name || '?').slice(0,1).toUpperCase())}</span>
                <span class="student-name">${esc(name)}</span>
                <span class="count-pill small">${list.length} 条</span>
                <span class="student-latest">${esc(formatTime(list[0].created_at))}</span>
                <i class="fas fa-chevron-down"></i>
              </button>
              <button class="btn btn-outline btn-mini" data-action="export-student" data-campus="${esc(campus)}" data-level="${esc(level)}" data-student="${esc(name)}" title="导出该学生录音"><i class="fas fa-download"></i> 导出</button>
              <button class="btn btn-danger btn-mini" data-action="delete-student" data-campus="${esc(campus)}" data-level="${esc(level)}" data-student="${esc(name)}" title="删除该学生全部录音"><i class="fas fa-trash"></i></button>
            </div>
            <div class="student-body ${studentOpen ? '' : 'hidden'}">
              ${list.map(renderRecCard).join('')}
            </div>
          </div>`;
      });

      levelsHtml += `
        <div class="level-group ${levelOpen ? 'open' : ''}">
          <div class="level-head-row">
            <button class="level-head" data-action="toggle-key" data-key="${esc(levelKey)}">
              <i class="fas fa-layer-group"></i>
              <span class="level-name">${esc(level)}</span>
              <span class="count-pill">${studentMap.size} 位 · ${levelTotal} 条</span>
              <i class="fas fa-chevron-down"></i>
            </button>
            <button class="btn btn-danger btn-mini" data-action="delete-level" data-campus="${esc(campus)}" data-level="${esc(level)}" title="删除该班级全部录音"><i class="fas fa-trash-alt"></i> 删除整组</button>
          </div>
          <div class="level-body ${levelOpen ? '' : 'hidden'}">${studentsHtml}</div>
        </div>`;
    });

    html.push(`
      <div class="campus-group ${campusOpen ? 'open' : ''}">
        <button class="campus-head" data-action="toggle-key" data-key="${esc(campusKey)}">
          <i class="fas fa-school"></i>
          <span class="campus-name">${esc(campus)}</span>
          <span class="count-pill">${campusTotal} 条</span>
          <i class="fas fa-chevron-down"></i>
        </button>
        <div class="campus-body ${campusOpen ? '' : 'hidden'}">${levelsHtml}</div>
      </div>`);
  });

  listEl.innerHTML = html.join('');
}

/* ====== 导出 & 批量删除 ====== */
async function ensureJSZip() {
  if (window.JSZip) return true;
  return new Promise(resolve => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
    s.onload = () => resolve(!!window.JSZip);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

async function exportStudent(campus, level, studentName) {
  const rows = recRows.filter(r =>
    (r.campus || '未分类') === campus &&
    (r.level || '未分类') === level &&
    (r.student_name || '未命名') === studentName
  );
  if (!rows.length) { toast('没有可导出的录音', true); return; }

  toast('⏳ 正在准备导出…');
  const ok = await ensureJSZip();
  if (!ok) { toast('打包库加载失败，请重试', true); return; }

  const zip = new JSZip();
  const folderName = `${campus}-${level}-${studentName}`.replace(/[\\/:*?"<>|]/g, '_');
  const folder = zip.folder(folderName);

  let success = 0;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (!r.public_url) continue;
    try {
      const res = await fetch(r.public_url);
      if (!res.ok) continue;
      const blob = await res.blob();
      const ext = (r.file_path || '').split('.').pop() || 'webm';
      const itemText = (r.item_text || '录音').replace(/[\\/:*?"<>|]/g, '_').slice(0, 30);
      const idx = String(i + 1).padStart(2, '0');
      folder.file(`${idx}_${itemText}.${ext}`, blob);
      success++;
    } catch (e) { console.warn('下载失败', r.public_url, e); }
  }
  if (!success) { toast('没有可下载的音频', true); return; }

  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${folderName}.zip`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast(`✅ 已导出 ${success} 条录音`);
}

async function deleteRecords(rows, label) {
  if (!rows.length) return;
  if (!confirm(`确定删除 ${label} 的 ${rows.length} 条录音吗？此操作不可恢复。`)) return;

  toast('⏳ 删除中…');
  const ids = rows.map(r => String(r.id));
  const idList = ids.map(id => encodeURIComponent(id)).join(',');
  try {
    await sbFetch(`/rest/v1/recordings?id=in.(${idList})`, { method: 'DELETE' });
  } catch (e) { console.warn('批量删除数据库失败', e); }

  const paths = rows.map(r => r.file_path).filter(Boolean);
  await batchDeleteStorage(paths);

  const idSet = new Set(ids);
  recRows = recRows.filter(r => !idSet.has(String(r.id)));
  paintRecList();
  toast(`🗑 已删除 ${rows.length} 条`);
}

    basic:'基本设置', pageBg:'页面背景', btnBg:'首页按钮背景',
    aiTalkMgmt:'Role-Play AI 管理', discMgmt:'AI Talk 管理',
    gameMgmt:'游戏管理', lrMgmt:'Listen & Read 管理', publish:'发布 / 备份'
  };
  Object.keys(sectionTitles).forEach(id => items.push({ kind:'section', label:sectionTitles[id], sub:'设置区块', sectionId:id, tab:'settings' }));
  (config.aiTalkButtons || []).forEach(b => items.push({ kind:'aiTalk', label:b.name || '(未命名)', sub:'Role-Play AI', sectionId:'aiTalkMgmt', tab:'settings', anchor:{ scope:'aiTalk', id:b.id } }));
  (config.discussionButtons || []).forEach(b => items.push({ kind:'discussion', label:b.name || '(未命名)', sub:'AI Talk', sectionId:'discMgmt', tab:'settings', anchor:{ scope:'discussion', id:b.id } }));
  (config.gameParts || []).forEach(p => {
    items.push({ kind:'part', label:p.name || '(未命名 Part)', sub:'游戏 Part', sectionId:'gameMgmt', tab:'settings', anchor:{ scope:'gamePart', partId:p.id } });
    (p.games || []).forEach(g => items.push({ kind:'game', label:g.name || '(未命名游戏)', sub:'游戏 · ' + (p.name || ''), sectionId:'gameMgmt', tab:'settings', anchor:{ scope:'game', partId:p.id, gameId:g.id } }));
  });
  (config.listenReadParts || []).forEach(p => {
    items.push({ kind:'lrPart', label:p.name || '(未命名单元)', sub:'听读单元', sectionId:'lrMgmt', tab:'settings', anchor:{ scope:'lrPart', partId:p.id } });
    (p.items || []).forEach(it => {
      const full = it.text || '';
      items.push({
        kind:'lrItem',
        label: full.length > 46 ? full.slice(0, 46) + '…' : (full || '(空句子)'),
        sub: '听读 · ' + (p.name || ''),
        fullText: full,
        sectionId:'lrMgmt', tab:'settings',
        anchor:{ scope:'lrItem', partId:p.id, itemId:it.id }
      });
    });
  });
  const seen = new Set();
  recRows.forEach(r => {
    const name = r.student_name;
    if (!name) return;
    const campus = r.campus || '未分类';
    const level = r.level || '未分类';
    const key = campus + '|' + level + '|' + name;
    if (seen.has(key)) return;
    seen.add(key);
    items.push({ kind:'student', label:name, sub:'学生录音 · ' + campus + ' / ' + level, tab:'recordings', campus, level });
  });
  return items;
}
function kindIcon(kind) {
  return { section:'fa-layer-group', aiTalk:'fa-comment-dots', discussion:'fa-comments', part:'fa-puzzle-piece', game:'fa-gamepad', lrPart:'fa-book-open', lrItem:'fa-font', student:'fa-user-circle' }[kind] || 'fa-search';
}
function openSearch() {
  const panel = document.getElementById('searchPanel');
  const input = document.getElementById('searchInput');
  panel.classList.remove('hidden');
  input.value = '';
  searchState.items = buildSearchIndex();
  runSearch('');
  setTimeout(() => input.focus(), 30);
  if (!recRows.length) {
    loadRecordings(false).then(() => {
      if (!document.getElementById('searchPanel').classList.contains('hidden')) {
        searchState.items = buildSearchIndex();
        runSearch(document.getElementById('searchInput').value);
      }
    });
  }
}
function closeSearch() { document.getElementById('searchPanel').classList.add('hidden'); searchState.active = -1; }
function runSearch(q) {
  const kw = q.trim().toLowerCase();
  const resultsEl = document.getElementById('searchResults');
  let res = searchState.items;
  if (kw) {
    res = res.filter(it => (it.label || '').toLowerCase().includes(kw) || (it.sub || '').toLowerCase().includes(kw) || (it.fullText || '').toLowerCase().includes(kw));
  } else res = res.slice(0, 12);
  searchState.results = res.slice(0, 40);
  searchState.active = searchState.results.length ? 0 : -1;
  if (!searchState.results.length) { resultsEl.innerHTML = '<div class="search-empty">没有找到匹配项</div>'; return; }
  resultsEl.innerHTML = searchState.results.map((it, i) => `
    <div class="search-item ${i === searchState.active ? 'active' : ''}" data-idx="${i}">
      <div class="si-icon"><i class="fas ${kindIcon(it.kind)}"></i></div>
      <div class="si-main">
        <div class="si-label">${esc(it.label)}</div>
        <div class="si-sub">${esc(it.sub || '')}</div>
      </div>
    </div>`).join('');
}
function setSearchActive(idx) {
  const items = document.querySelectorAll('#searchResults .search-item');
  if (!items.length) return;
  if (idx < 0) idx = items.length - 1;
  if (idx >= items.length) idx = 0;
  searchState.active = idx;
  items.forEach((el, i) => el.classList.toggle('active', i === idx));
  items[idx].scrollIntoView({ block: 'nearest' });
}
function jumpToResult(item) {
  closeSearch();

  if (item.tab === 'recordings') {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'recordings'));
    currentTab = 'recordings';
    document.getElementById('settingsPanel').classList.add('hidden');
    document.getElementById('recordingsPanel').classList.remove('hidden');
    updateFloatingPalette();

    recFilter.name = item.kind === 'student' ? item.label : '';
    recFilter.part = '';
    recFilter.campus = '';
    recFilter.level = '';
    if (item.kind === 'student') {
      expandedKeys.add('c:' + item.campus);
      expandedKeys.add('l:' + item.campus + '::' + item.level);
      expandedKeys.add('s:' + item.campus + '::' + item.level + '::' + item.label);
    }
    paintRecToolbarAndList();
    setTimeout(() => {
      const targetGroup = document.querySelector(`.student-group[data-student-key="${cssEscape('s:' + item.campus + '::' + item.level + '::' + item.label)}"]`);
      if (targetGroup) {
        targetGroup.scrollIntoView({ behavior: 'smooth', block: 'center' });
        targetGroup.classList.add('search-highlight');
        setTimeout(() => targetGroup.classList.remove('search-highlight'), 1800);
      }
    }, 60);
    return;
  }

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'settings'));
  currentTab = 'settings';
  document.getElementById('settingsPanel').classList.remove('hidden');
  document.getElementById('recordingsPanel').classList.add('hidden');
  expanded.add(item.sectionId);
  updateFloatingPalette();
  renderSettings();

  setTimeout(() => {
    let targetEl = null;
    const a = item.anchor;
    if (a) {
      if (a.scope === 'aiTalk') { const inp = document.querySelector(`[data-scope="aiTalk"][data-id="${cssEscape(a.id)}"]`); targetEl = inp && inp.closest('.editor-item'); }
      else if (a.scope === 'discussion') { const inp = document.querySelector(`[data-scope="discussion"][data-id="${cssEscape(a.id)}"]`); targetEl = inp && inp.closest('.editor-item'); }
      else if (a.scope === 'gamePart') { const inp = document.querySelector(`[data-scope="gamePart"][data-part-id="${cssEscape(a.partId)}"]`); targetEl = inp && inp.closest('.editor-item'); }
      else if (a.scope === 'game') { const inp = document.querySelector(`[data-scope="game"][data-part-id="${cssEscape(a.partId)}"][data-game-id="${cssEscape(a.gameId)}"]`); targetEl = inp && inp.closest('.editor-item'); }
      else if (a.scope === 'lrPart') { const inp = document.querySelector(`[data-scope="lrPart"][data-part-id="${cssEscape(a.partId)}"]`); targetEl = inp && inp.closest('.editor-item'); }
      else if (a.scope === 'lrItem') { targetEl = document.querySelector(`.editor-item[data-lr-item="${cssEscape(a.itemId)}"]`); }
    }
    if (!targetEl) targetEl = document.querySelector(`.section[data-section="${item.sectionId}"]`);
    if (targetEl) {
      targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      targetEl.classList.add('search-highlight');
      setTimeout(() => targetEl.classList.remove('search-highlight'), 1800);
    }
  }, 60);
}

document.getElementById('searchFab').onclick = () => {
  const panel = document.getElementById('searchPanel');
  if (panel.classList.contains('hidden')) openSearch(); else closeSearch();
};
document.getElementById('searchInput').addEventListener('input', e => runSearch(e.target.value));
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); setSearchActive(searchState.active + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setSearchActive(searchState.active - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); const item = searchState.results[searchState.active]; if (item) jumpToResult(item); }
  else if (e.key === 'Escape') closeSearch();
});
document.getElementById('searchResults').addEventListener('click', e => {
  const row = e.target.closest('.search-item');
  if (!row) return;
  const idx = parseInt(row.dataset.idx, 10);
  const item = searchState.results[idx];
  if (item) jumpToResult(item);
});
document.addEventListener('mousedown', e => {
  const panel = document.getElementById('searchPanel');
  if (!panel || panel.classList.contains('hidden')) return;
  if (e.target.closest('#searchPanel') || e.target.closest('#searchFab')) return;
  closeSearch();
});
document.addEventListener('keydown', e => {
  const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
  if ((isMac ? e.metaKey : e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (loggedIn) openSearch(); }
  if (e.key === 'Escape') closeSearch();
});

/* 启动 */
(async function init() {
  loadConfigFromStorage();
  showLogin();
  const ok = await loadConfigFromCloud(false);
  if (ok) updateStatusBadge();
  document.getElementById('loginPwd').focus();
})();
</script>
